<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* EPUB cover, rendered at 1600 x 2400 by scripts/build_books.py */
* { margin: 0; box-sizing: border-box; }
html, body { width: 1600px; height: 2400px; overflow: hidden; }
body { color: #fff; font-family: Inter, "Helvetica Neue", Arial, sans-serif; background-color: #0B0B0C; background-image:
  radial-gradient(70% 45% at 50% 100%, rgba(204,120,92,.45), transparent 72%),
  radial-gradient(45% 30% at 0% 0%, rgba(42,133,255,.16), transparent 70%),
  radial-gradient(circle at 2px 2px, rgba(255,255,255,.07) 2px, transparent 3px),
  linear-gradient(#141416, #0A0A0B);
  background-size: auto, auto, 34px 34px, auto;
  display: flex; flex-direction: column; justify-content: space-between; padding: 150px 140px 140px; }
.kicker { font: 600 36px/1.3 Inter, Arial, sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #A3CFFF; }
.code { font: 900 260px/1 Inter, Arial, sans-serif; letter-spacing: -.03em; margin-top: 120px; }
.name { font: 700 76px/1.15 Inter, Arial, sans-serif; margin-top: 50px; max-width: 13em; }
.what { font: 400 50px/1.4 Inter, Arial, sans-serif; color: #D4D4D4; margin-top: 60px; max-width: 18em; }
.foot { font: 500 34px/1.5 Inter, Arial, sans-serif; color: #A8A8A8; }
</style>
</head>
<body>
  <div>
    <p class="kicker">Claude Certification Guide</p>
    <p class="code">__CODE__</p>
    <p class="name">__NAME__</p>
    <p class="what">The complete study guide, with 30 practice questions and an answer key</p>
  </div>
  <p class="foot">__EDITION__<br>github.com/preporato/claude-certification-guide</p>
</body>
</html>
