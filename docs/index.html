e so the skipped files can be queued for a focused pass. Self-reported confidence (C) is poorly calibrated and says nothing about what was skipped. A longer summary (B) adds words without the counts. A stronger model (A) can still hit a budget, and the report would still hide it."},{"n":9,"domain":"d1","scenario":null,"stem":"After the first tool call, every follow-up request in your agent loop fails with a 400 error. Here is how the loop builds the next request. What is wrong?","code":{"lang":"python","text":"response = client.messages.create(model=MODEL, max_tokens=1024,\n                                  tools=tools, messages=messages)\nif response.stop_reason == \"tool_use\":\n    call = next(b for b in response.content if b.type == \"tool_use\")\n    result = run_tool(call.name, call.input)\n    messages.append({\"role\": \"user\", \"content\": [{\n        \"type\": \"tool_result\",\n        \"tool_use_id\": call.id,\n        \"content\": result,\n    }]})"},"options":[{"letter":"A","text":"The loop should set `tool_choice` to `any` after the first call"},{"letter":"B","text":"The assistant turn containing the `tool_use` block is never appended, so the `tool_result` refers to a call the next request doesn't contain"},{"letter":"C","text":"`tool_result` blocks belong in the system prompt"},{"letter":"D","text":"`max_tokens` is too low for a tool loop"}],"answer":["B"],"explanation":"The API is stateless, so each request must carry the whole exchange: the assistant message with the `tool_use` block comes first, then the user message with the matching `tool_result` (B). Without it, the `tool_use_id` points at nothing. C misplaces tool results, which go in a user turn. D and A change settings that have nothing to do with a malformed history."},{"n":10,"domain":"d1","scenario":null,"stem":"Your research agent uses the server-side web search tool. Some responses come back with `stop_reason` `pause_turn`, and the loop treats them as finished, returning half-done research. What is the correct handling?","code":null,"options":[{"letter":"A","text":"Send a follow-up request with the paused assistant response appended as-is, so Claude can continue the server-side work"},{"letter":"B","text":"Raise `max_tokens` and send the original request again"},{"letter":"C","text":"Treat `pause_turn` the same as `end_turn`"},{"letter":"D","text":"Run the web search locally and return a `tool_result` for it"}],"answer":["A"],"explanation":"`pause_turn` means a server-side tool loop reached its iteration limit mid-task. The documented handling is A: return the response as the latest assistant turn, and Claude picks up where it stopped. C is the bug in the question. D treats a server tool like a client tool; there is no `tool_use` for your code to answer. B restarts the work and pays for it twice."},{"n":11,"domain":"d1","scenario":null,"stem":"A team answers one-line FAQ questions from a two-page policy with a six-subagent pipeline: retriever, reader, drafter, tone checker, fact checker and formatter. Answers take 25 seconds and cost far more than expected. What is the best change?","code":null,"options":[{"letter":"A","text":"Collapse it to a single model call with the policy in context, plus a lightweight validation step if needed"},{"letter":"B","text":"Move every subagent to the most capable model to cut retries"},{"letter":"C","text":"Run the six subagents in parallel under a coordinator"},{"letter":"D","text":"Cache each subagent's output"}],"answer":["A"],"explanation":"This is over-decomposition: the task is small, single-domain and fits in one context, so the subagents add orchestration cost without any isolation benefit, and A removes the overhead. Parallelizing (C) doesn't fit a chain where each step needs the previous step's output. B raises the cost of a design that shouldn't exist. D helps only with repeated identical questions and leaves the latency of the chain in place."},{"n":12,"domain":"d1","scenario":null,"stem":"A payments service's error rate spiked. The cause could be in code, configuration, infrastructure or a third-party API, and what to check next depends on what each check finds. How should the coordinator decompose the investigation?","code":null,"options":[{"letter":"A","text":"One prompt asking Claude for the root cause"},{"letter":"B","text":"A fixed pipeline that runs the four checks in a set order"},{"letter":"C","text":"Dynamic decomposition: plan the next subtasks from each finding, with a token budget and iteration cap enforced in code as safety nets"},{"letter":"D","text":"Run every conceivable check in parallel with no coordinator"}],"answer":["C"],"explanation":"Open-ended investigations, where the next step depends on what you just learned, call for dynamic decomposition. Because that pattern costs more and can wander, C pairs it with limits enforced outside the model. A fixed pipeline (B) suits workflows that are known in advance. D wastes effort and leaves nobody to connect the findings. A asks for an answer without giving the model any way to gather evidence."},{"n":13,"domain":"d1","scenario":null,"stem":"Long research tasks sometimes use ten times the expected tokens. Which TWO belong in a reliable token-budget design? (Select TWO)","code":null,"options":[{"letter":"A","text":"Setting `max_tokens` to 50 on every call"},{"letter":"B","text":"Asking Claude each turn how many tokens it has used so far"},{"letter":"C","text":"A system-prompt instruction asking Claude to stay under 50,000 tokens"},{"letter":"D","text":"Track cumulative input and output tokens from each response's usage field inside the loop"},{"letter":"E","text":"Stop the loop in code when the budget is reached, with a wrap-up instruction injected at about 80% of the budget"}],"answer":["D","E"],"explanation":"Budgets are enforced from outside the model: measure from the usage field (D) and act on the measurement with a soft warning and a hard stop (E). An instruction (C) and the model's own estimate (B) are probabilistic and unmeasured. A tiny `max_tokens` (A) truncates every response, so turns end at the cap before they finish."},{"n":14,"domain":"d2","scenario":null,"stem":"A team's MCP server should (1) let Claude create Jira tickets, (2) expose the team's API schema files so a user can attach them as context, and (3) provide a reusable 'triage this incident' template with the team's severity rubric. Which MCP primitives fit, in that order?","code":null,"options":[{"letter":"A","text":"Tool, tool, tool"},{"letter":"B","text":"Resource, tool, prompt"},{"letter":"C","text":"Prompt, resource, tool"},{"letter":"D","text":"Tool, resource, prompt"}],"answer":["D"],"explanation":"Creating a ticket is an action, so it's a tool. Schema files are read-only data for the client to browse and attach, so they're a resource. The packaged triage template is a prompt. D matches action, data and know-how in that order. A turns data and a template into callable functions. B and C put the action in the wrong primitive."},{"n":15,"domain":"d2","scenario":null,"stem":"Every developer on a team should get the same internal MCP server in Claude Code, and the server needs an API token. Which TWO choices are correct? (Select TWO)","code":null,"options":[{"letter":"A","text":"Put the token in `CLAUDE.md` so Claude can pass it to the server"},{"letter":"B","text":"Paste the raw token into `.mcp.json` so setup is a single step"},{"letter":"C","text":"Define the server in the project's `.mcp.json` and commit it to the repository"},{"letter":"D","text":"Reference the token in `.mcp.json` as `${INTERNAL_API_TOKEN}` and have each developer set that environment variable"},{"letter":"E","text":"Have each developer add the server with local scope by following a wiki page"}],"answer":["C","D"],"explanation":"Project scope (C) is the configuration that reaches the whole team through version control, and environment variable expansion (D) keeps the secret out of the repository. B commits a credential. E relies on every developer repeating a manual step, and local scope never propagates. A puts a secret into the model's context, where it can leak through outputs or logs."},{"n":16,"domain":"d2","scenario":null,"stem":"When users ask to change their email address, Claude often calls `get_customer` instead of `update_customer`, then tells the user the change is done. Both tools exist. What is the first fix?","code":null,"options":[{"letter":"A","text":"Add a system-prompt line telling Claude to use `update_customer` for updates"},{"letter":"B","text":"Rewrite both descriptions: what each tool does, when to use it, and when to use the other one instead, with `get_customer` described as read-only"},{"letter":"C","text":"Rename `get_customer` to `fetch_customer`"},{"letter":"D","text":"Remove `get_customer` from the agent"}],"answer":["B"],"explanation":"Claude selects tools mainly from their descriptions, so overlapping or vague descriptions are the first thing to fix (B), and the boundary statements ('to change a record, use `update_customer`') are what resolve this confusion. A rename (C) changes little while the descriptions stay vague. A system-prompt patch (A) is weaker than fixing the routing signal itself. Removing the read tool (D) breaks every legitimate lookup."},{"n":17,"domain":"d3","scenario":null,"stem":"Your team wants every file Claude edits to be formatted with Prettier immediately after each edit, for everyone working in the repository. Which configuration does that?","code":null,"options":[{"letter":"A","text":"A hook in each developer's `~/.claude/settings.json`"},{"letter":"B","text":"A `CLAUDE.md` line: 'Run Prettier after every edit'"},{"letter":"C","text":"A `PostToolUse` hook in the committed `.claude/settings.json`, matching `Edit|Write`, that runs Prettier on the edited file"},{"letter":"D","text":"A `PreToolUse` hook on `Edit` that runs Prettier"}],"answer":["C"],"explanation":"Formatting has to run after the file changes, which is `PostToolUse`, and the committed project settings file shares the hook with the whole team, so C covers both requirements. D runs before the edit exists. B is guidance Claude may skip, while a hook runs every time. A works only for developers who set it up themselves."},{"n":18,"domain":"d3","scenario":null,"stem":"A team requires that Claude never ends its work while the test suite is failing. Which hook enforces this?","code":null,"options":[{"letter":"A","text":"A `SessionEnd` hook that runs the tests"},{"letter":"B","text":"A `Stop` hook that runs the tests and exits with code 2, printing the failures to stderr, when any test fails"},{"letter":"C","text":"A `PostToolUse` hook that runs the tests after every file read"},{"letter":"D","text":"A `UserPromptSubmit` hook that runs the tests before each prompt"}],"answer":["B"],"explanation":"Exit code 2 from a `Stop` hook prevents Claude from stopping and feeds the stderr text back, so Claude keeps working on the failures (B). `SessionEnd` (A) fires as the session closes and can't block anything. D tests before the work happens. C runs constantly at the wrong moment and can't stop Claude from finishing."},{"n":19,"domain":"d3","scenario":null,"stem":"A `PostToolUse` hook on `Write` scans each file Claude writes. It finds an API key in a file Claude just wrote and exits with code 2. What happens?","code":null,"options":[{"letter":"A","text":"The file has already been written; Claude receives the hook's stderr message and can act on it, for example by removing the key"},{"letter":"B","text":"Claude Code shuts down the session"},{"letter":"C","text":"Nothing happens, because exit code 2 is ignored for `PostToolUse`"},{"letter":"D","text":"The write is cancelled and the file is never created"}],"answer":["A"],"explanation":"`PostToolUse` fires after the tool has run, so it can't undo the write; exit code 2 shows its stderr to Claude (A). To stop the write itself, the check belongs in a `PreToolUse` hook, where exit code 2 blocks the call, which is the behavior D describes. B and C describe behaviors that don't exist."},{"n":20,"domain":"d3","scenario":null,"stem":"A developer asks Claude Code to migrate 40 files from a callback-based API client to async/await. The change touches shared types, and there are two reasonable migration strategies. What is the best way to start?","code":null,"options":[{"letter":"A","text":"One prompt for the whole change, then review the final diff"},{"letter":"B","text":"Direct execution, file by file, fixing problems as they appear"},{"letter":"C","text":"A `CLAUDE.md` rule saying 'use async/await'"},{"letter":"D","text":"Plan Mode: let Claude explore the codebase and propose a migration plan to review before any file changes"}],"answer":["D"],"explanation":"Multi-file, cross-cutting changes with more than one valid approach are Plan Mode's case (D): the strategy gets agreed before 40 files move. B and A commit to an approach before anyone has compared the options, and a wrong choice is expensive to unwind. C states a preference without planning the migration."},{"n":21,"domain":"d3","scenario":null,"stem":"A team's dependency-audit skill prints thousands of lines of output, and teammates complain it floods the main conversation. Which frontmatter change fixes this?","code":null,"options":[{"letter":"A","text":"`context: fork`, so the skill runs in an isolated subagent and returns its result"},{"letter":"B","text":"`disable-model-invocation: true`"},{"letter":"C","text":"`allowed-tools: Read`"},{"letter":"D","text":"`model: haiku`"}],"answer":["A"],"explanation":"`context: fork` (A) runs the skill in its own subagent context, so the verbose work stays out of the main conversation. B only stops Claude from invoking the skill automatically; the output still floods the conversation whenever someone runs it. C changes which tools are pre-approved and D changes the model, and neither moves the output."},{"n":22,"domain":"d3","scenario":null,"stem":"In a monorepo, files under `services/payments/` follow strict rules (all amounts in integer cents, no floats). The rules confuse Claude when it works on the frontend. Which TWO placements load these rules only when Claude works in the payments code? (Select TWO)","code":null,"options":[{"letter":"A","text":"A section titled 'Payments only' in the root `CLAUDE.md`"},{"letter":"B","text":"A `CLAUDE.md` file inside `services/payments/`"},{"letter":"C","text":"A file in `.claude/rules/` with `paths: [\"services/payments/**\"]` in its frontmatter"},{"letter":"D","text":"Each developer's `~/.claude/CLAUDE.md`"},{"letter":"E","text":"The project's `.mcp.json`"}],"answer":["B","C"],"explanation":"A path-scoped rule (C) loads when Claude reads or edits a matching file, and a subdirectory `CLAUDE.md` (B) loads on demand when Claude works with files in that directory. The root `CLAUDE.md` (A) loads in every session, frontend work included. D is personal and reaches nobody else. E configures MCP servers and holds no instructions."},{"n":23,"domain":"d4","scenario":null,"stem":"A code-review prompt says 'Be thorough but avoid nitpicks.' Reviews flag style issues inconsistently and miss SQL injection. Which rewrite fixes the cause?","code":null,"options":[{"letter":"A","text":"'You are a world-class senior security engineer.'"},{"letter":"B","text":"'Be extremely thorough and never miss anything.'"},{"letter":"C","text":"'Be conservative with your comments.'"},{"letter":"D","text":"'Report only these issues: SQL injection, XSS, authentication bypass and secrets in code. Report high or critical severity only. Do not comment on formatting or naming.'"}],"answer":["D"],"explanation":"Vague instructions produce inconsistent behavior because the model has to guess the threshold. D names the categories, the severity floor and the exclusions, and anyone reading a review can check whether it followed them. B and C push the same vague guidance in two directions. A role line (A) without criteria leaves the same guesswork."},{"n":24,"domain":"d4","scenario":null,"stem":"A classifier should flag support tickets that mention a physical safety risk. In testing it flags every ticket containing the word 'fire', including 'firewall rules reset after update.' What is the best few-shot improvement?","code":null,"options":[{"letter":"A","text":"An instruction: 'Don't be fooled by keywords.'"},{"letter":"B","text":"Two to four examples that include the firewall ticket labeled not-safety with a one-line reason, a genuine safety ticket, and an ambiguous case"},{"letter":"C","text":"Twenty examples of genuine safety tickets"},{"letter":"D","text":"A lower temperature"}],"answer":["B"],"explanation":"Few-shot examples teach reasoning and edge cases best when they include something the model should leave alone, so the tricky negative in B is the example that matters. C piles on positives and teaches nothing about the false positives. A is vague guidance. Temperature (D) changes randomness and leaves the misunderstanding in place."},{"n":25,"domain":"d4","scenario":null,"stem":"Your team plans to use structured outputs (a JSON schema in `output_config.format`) for invoice extraction. Which TWO statements about this feature are true? (Select TWO)","code":null,"options":[{"letter":"A","text":"It guarantees the extracted values are correct for the source document"},{"letter":"B","text":"It works only when `tool_choice` forces a specific tool"},{"letter":"C","text":"It removes the need to validate business rules, such as totals matching line items"},{"letter":"D","text":"Constrained decoding makes the response valid JSON that matches the schema's structure and types"},{"letter":"E","text":"A refusal or a `max_tokens` cutoff can still produce output that doesn't match the schema, so check `stop_reason`"}],"answer":["D","E"],"explanation":"Structured outputs guarantee format: valid, schema-compliant JSON (D), with the documented exceptions of refusals and truncation (E). Format says nothing about whether the values are right, so semantic checks such as totals and dates stay in your pipeline, which rules out A and C. B confuses the feature with forced tool use; structured outputs are requested through `output_config.format`."},{"n":26,"domain":"d4","scenario":null,"stem":"An extraction fails validation because `invoice_date` came back as 2026-04-31, a date that doesn't exist. What should the retry request contain?","code":null,"options":[{"letter":"A","text":"The failed output and the words 'try again'"},{"letter":"B","text":"The original document again with no other changes"},{"letter":"C","text":"The original document, the failed output, and the specific error ('`invoice_date` 2026-04-31 is not a valid date'), with an instruction to correct only that field"},{"letter":"D","text":"The same request sent to a more capable model"}],"answer":["C"],"explanation":"A useful retry tells the model exactly what failed and gives it the source to fix it against (C). B repeats the conditions that produced the error. A removes the source the model needs to correct the date. D changes the model without telling it what went wrong."},{"n":27,"domain":"d4","scenario":null,"stem":"A product team wants to move its live chat assistant to the Message Batches API to cut costs in half. What is the right assessment?","code":null,"options":[{"letter":"A","text":"Reject it, because batch requests can't include a system prompt"},{"letter":"B","text":"Approve it: the same quality at half the price"},{"letter":"C","text":"Approve it, provided the app polls for results every second"},{"letter":"D","text":"Reject it: batches carry no latency guarantee (most finish within an hour, some take up to 24), so a waiting user can't be served; cut costs with prompt caching or by routing routine messages to a cheaper tier"}],"answer":["D"],"explanation":"The batch discount comes with asynchronous processing and no latency guarantee, which rules it out for anyone waiting on an answer (D). B ignores the latency. Polling (C) doesn't speed up processing. A is false: batch requests take the same parameters as regular Messages requests."},{"n":28,"domain":"d4","scenario":null,"stem":"One prompt asks Claude to extract 30 fields from a contract, normalize every currency, classify the risk clauses and write an executive summary. Results vary from run to run, and errors are hard to trace. What is the best restructuring?","code":null,"options":[{"letter":"A","text":"A chain of focused prompts (extract, validate, normalize, classify, summarize), each with its own instructions and checks"},{"letter":"B","text":"The same single prompt on a more capable model"},{"letter":"C","text":"Ask for the executive summary first, then the fields"},{"letter":"D","text":"The same single prompt with each requirement marked IMPORTANT"}],"answer":["A"],"explanation":"Prompt chaining gives each stage one job and a validation point, so a failure shows up in the stage that caused it (A). Emphasis (D) doesn't reduce the number of jobs in one prompt. A stronger model (B) may help a little and leaves errors untraceable. Reordering (C) builds the summary on fields nobody has checked yet."},{"n":29,"domain":"d5","scenario":null,"stem":"A knowledge-base Q&A agent receives 40 retrieved passages per question. The passage with the answer usually lands near the middle, and answers often miss it. Which TWO changes address this? (Select TWO)","code":null,"options":[{"letter":"A","text":"Retrieve 80 passages instead of 40"},{"letter":"B","text":"Re-rank the passages and pass only the most relevant few"},{"letter":"C","text":"Raise the temperature"},{"letter":"D","text":"Put the passages first and the question and instructions at the end of the prompt"},{"letter":"E","text":"Switch to a model with a larger context window"}],"answer":["B","D"],"explanation":"Attention is weakest in the middle of long contexts, so the fixes shrink the middle and move what matters to the edges: fewer, better passages (B), and long material first with the question last, which Anthropic's long-context guidance recommends (D). A bigger window (E) and more passages (A) make the middle longer. Temperature (C) affects randomness and does nothing for attention."},{"n":30,"domain":"d5","scenario":null,"stem":"Two internal documents disagree about the warranty period: a 2024 policy says 12 months and a 2026 update says 24 months. What should the agent's answer do?","code":null,"options":[{"letter":"A","text":"Decline to answer until someone fixes the documents"},{"letter":"B","text":"State 24 months without mentioning the conflict, because the newer document wins"},{"letter":"C","text":"Give the answer with attribution: both values, their documents and dates, the newer one identified as likely current, and the conflict flagged for review"},{"letter":"D","text":"Average the two and state 18 months"}],"answer":["C"],"explanation":"Provenance keeps each claim tied to its source and surfaces conflicts instead of settling them silently (C). Silently picking one value (B) is the tested anti-pattern even when the choice happens to be right, because nobody learns that the documents disagree. D produces a number neither source supports. A withholds an answer the agent can give with a caveat."}]},{"id":"ccar-p","code":"CCAR-P","name":"Claude Certified Architect - Professional","certPage":"https://preporato.com/certificates/claude-certified-architect-professional","guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccar-p/guide.md","exam":{"questions":63,"minutes":120},"minutes":60,"domains":[{"id":"d1","name":"Solution Design & Architecture","weight":17,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccar-p/guide.md#domain-1-solution-design--architecture-17"},{"id":"d2","name":"Claude Models, Prompting & Context Engineering","weight":13,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccar-p/guide.md#domain-2-models-prompting--context-engineering-13"},{"id":"d3","name":"Integration","weight":19,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccar-p/guide.md#domain-3-integration-19"},{"id":"d4","name":"Evaluation, Testing & Optimization","weight":16,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccar-p/guide.md#domain-4-evaluation-testing--optimization-16"},{"id":"d5","name":"Governance, Safety & Risk Management","weight":14,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccar-p/guide.md#domain-5-governance-safety--risk-14"},{"id":"d6","name":"Stakeholder Communication & Lifecycle Management","weight":14,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccar-p/guide.md#domain-6-stakeholder-communication--lifecycle-14"},{"id":"d7","name":"Developer Productivity & Operational Enablement","weight":7,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccar-p/guide.md#domain-7-developer-productivity--enablement-7"}],"scenarios":[],"questions":[{"n":1,"domain":"d1","scenario":null,"stem":"A support team wants answers to product questions grounded in a 300-page manual. Questions are single-turn, and the manual is updated monthly. What is the simplest sufficient architecture?","code":null,"options":[{"letter":"A","text":"An augmented LLM: retrieval over the manual feeding a single model call that cites the passages it used"},{"letter":"B","text":"An autonomous agent that browses the manual page by page"},{"letter":"C","text":"A multi-agent research system with a planner and three specialists"},{"letter":"D","text":"A model fine-tuned on the manual every month"}],"answer":["A"],"explanation":"One well-scoped, grounded call meets the requirement, so retrieval plus a single call is the simplest sufficient pattern (A). C and B add autonomy the task doesn't need, with the cost and latency to match. Monthly fine-tuning (D) is heavy, slower to update than re-indexing, and gives no citations."},{"n":2,"domain":"d1","scenario":null,"stem":"Which architecture proposal for an invoice-processing assistant is complete?","code":null,"options":[{"letter":"A","text":"Extraction with schema validation; posting to the ERP; a dashboard of monthly volume"},{"letter":"B","text":"Email intake and OCR; extraction with schema validation; posting to the ERP with an exceptions queue; per-field accuracy evals, user corrections and monitoring fed back into prompt and model decisions"},{"letter":"C","text":"Email intake and OCR; extraction with the most capable model; posting to the ERP"},{"letter":"D","text":"Email intake; a multi-agent extraction team; posting to the ERP; a launch announcement"}],"answer":["B"],"explanation":"A complete architecture has input, processing, output and a feedback loop that turns evals, user corrections and monitoring into design changes (B). C has no feedback loop. A has no input stage, and a volume dashboard measures activity without feeding quality back. D adds complexity and still has no feedback loop."},{"n":3,"domain":"d1","scenario":null,"stem":"Two designs meet the accuracy target. Design 1 uses the top tier: p95 latency 6 seconds, $0.09 per request. Design 2 routes between the fast and balanced tiers: p95 latency 2 seconds, $0.02 per request. The client's stated constraint is a 3-second p95 SLA at 2 million requests a month. Which design, and why?","code":null,"options":[{"letter":"A","text":"Run both in production indefinitely"},{"letter":"B","text":"Postpone the decision until a newer model is released"},{"letter":"C","text":"Design 1, for quality headroom"},{"letter":"D","text":"Design 2, because it meets the latency SLA and the cost pillar at the same accuracy"}],"answer":["D"],"explanation":"When both options meet accuracy, the stated business constraint decides, and only Design 2 meets the 3-second SLA, at about $40,000 a month against $180,000 (D). C breaks the SLA. A doubles cost and complexity for no reason. B ignores a decision the data already supports."},{"n":4,"domain":"d1","scenario":null,"stem":"A due-diligence system must analyze each target company's financials, legal filings and press coverage. The three analyses are independent, and each needs different tools and sources. Which design fits?","code":null,"options":[{"letter":"A","text":"Three separate systems whose reports nobody combines"},{"letter":"B","text":"One agent holding all the tools for all three analyses"},{"letter":"C","text":"An orchestrator with three scoped subagents running in parallel, followed by a synthesis step"},{"letter":"D","text":"One agent doing the three analyses in sequence"}],"answer":["C"],"explanation":"Independent subtasks with different tool needs are what justifies decomposition: each subagent gets a narrow toolset and its own context, and the orchestrator merges the results (C). B is capability bloat. D gives up parallelism and mixes three contexts. A skips the synthesis the client actually needs."},{"n":5,"domain":"d1","scenario":null,"stem":"A global retailer's policy assistant covers 14 regions. Each region's policies differ and are owned by different teams. Answers mix rules from different regions. What is the best design change?","code":null,"options":[{"letter":"A","text":"Put all 14 regions' policies in every request"},{"letter":"B","text":"Partition by data domain: tag documents with their region and filter retrieval by the user's region before semantic search"},{"letter":"C","text":"Fourteen agents that negotiate with each other on every question"},{"letter":"D","text":"Ask users to mention their region and change nothing else"}],"answer":["B"],"explanation":"The data has a clean partition, so filtering on region metadata keeps other regions' rules out of the context (B). C adds coordination machinery to a retrieval problem. A is context stuffing. D leaves the mixed retrieval in place."},{"n":6,"domain":"d2","scenario":null,"stem":"Which TWO workloads benefit most from prompt caching? (Select TWO)","code":null,"options":[{"letter":"A","text":"Single requests shorter than the minimum cacheable length"},{"letter":"B","text":"Requests whose first line is the current timestamp"},{"letter":"C","text":"An agent loop that resends the same 12,000-token system prompt and tool definitions on every turn"},{"letter":"D","text":"An endpoint where many users ask questions about the same 50-page policy within minutes of each other"},{"letter":"E","text":"A weekly job that sends one unique 3,000-token prompt"}],"answer":["C","D"],"explanation":"Caching pays off when a long, stable prefix repeats within the cache lifetime (C, D). A weekly unique prompt (E) never repeats in time. A timestamp at the start (B) breaks the prefix on every request. Prompts under the minimum length (A) are never cached."},{"n":7,"domain":"d2","scenario":null,"stem":"An eligibility step must apply six interacting rules. Accuracy is the priority, and the latency budget is generous. Which prompting approach fits?","code":null,"options":[{"letter":"A","text":"A lower temperature"},{"letter":"B","text":"Few-shot examples alone, with no stated rules"},{"letter":"C","text":"Have the model reason through the rules step by step (or enable thinking) before deciding, with each rule stated as an explicit criterion, then validate the decision"},{"letter":"D","text":"A zero-shot prompt kept as short as possible"}],"answer":["C"],"explanation":"Multi-step logic benefits from explicit reasoning before the answer, and the generous latency budget covers its cost (C). Zero-shot (D) suits simple, unambiguous tasks. Examples (B) teach format and edge cases, and six interacting rules still need to be stated. Temperature (A) adds no reasoning."},{"n":8,"domain":"d2","scenario":null,"stem":"An enterprise assistant's system prompt has grown to 60,000 tokens of procedures for 40 business processes, and most requests need one or two of them. Latency and cost are high, and instruction-following has slipped. What is the best restructuring?","code":null,"options":[{"letter":"A","text":"Build 40 separate assistants and make users choose"},{"letter":"B","text":"Move to a model with a larger context window"},{"letter":"C","text":"Mark the most important procedures in capitals"},{"letter":"D","text":"Keep the system prompt to the core role and rules, and package each procedure as a Skill or retrievable module that loads only when relevant"}],"answer":["D"],"explanation":"Loading procedures on demand keeps the context small and focused, which improves attention, cost and latency together (D). Emphasis (C) doesn't shrink the prompt. A bigger window (B) holds more of the same dilution. A moves the routing problem onto users."},{"n":9,"domain":"d2","scenario":null,"stem":"Downstream systems consume the assistant's JSON, and occasional schema violations cause failed transactions. Which change addresses this at the source, and what still needs checking?","code":null,"options":[{"letter":"A","text":"Structured outputs with the integration schema, which guarantees schema-valid JSON, plus semantic validation of the values and handling of the refusal and `max_tokens` stop reasons"},{"letter":"B","text":"A stronger instruction to follow the schema"},{"letter":"C","text":"A retry loop and nothing else"},{"letter":"D","text":"A regex that repairs broken JSON"}],"answer":["A"],"explanation":"Constrained decoding removes schema violations at the source, and semantic checks plus stop-reason handling cover what it doesn't guarantee (A). Retries (C) and instructions (B) reduce failures without eliminating them. Regex repair (D) guesses at intent and can corrupt data quietly."},{"n":10,"domain":"d3","scenario":null,"stem":"A procurement agent must get quotes from a supplier's own AI agent, which runs on the supplier's systems with its own tools, policies and reasoning. Which integration mechanism fits?","code":null,"options":[{"letter":"A","text":"Agent-to-agent delegation over a defined protocol, with explicit request and response contracts, authentication, and failure isolation"},{"letter":"B","text":"A direct API call to Claude with the supplier's price list pasted into the prompt"},{"letter":"C","text":"An MCP server that gives your agent direct access to the supplier's database"},{"letter":"D","text":"A shared system prompt that both companies edit"}],"answer":["A"],"explanation":"Two autonomous systems with separate owners, tools and policies call for delegation between agents, with contracts and isolation so either side can fail independently (A). C bypasses the supplier's agent and policies and assumes access you won't get. B works only if you already have current prices, which is what you're asking for. D merges two organizations' control into one prompt."},{"n":11,"domain":"d3","scenario":null,"stem":"One internal app sends support tickets to Claude for tagging. One team owns it, and no reuse is planned. A platform engineer proposes building an MCP server first. What is the right assessment?","code":null,"options":[{"letter":"A","text":"Fine-tune a tagging model instead"},{"letter":"B","text":"Build the MCP server, since every integration should use MCP"},{"letter":"C","text":"Use a direct API integration now; MCP adds a protocol layer and maintenance without a reuse need, so revisit it if other surfaces need the capability"},{"letter":"D","text":"Use agent-to-agent delegation"}],"answer":["C"],"explanation":"MCP pays off when one capability serves many clients or surfaces, and one app with one owner is the direct-API case (C). B adds maintenance for a benefit that doesn't exist yet. D adds autonomous-system machinery to a single call. A skips a simpler option that works."},{"n":12,"domain":"d3","scenario":null,"stem":"Which TWO observations are signs of capability bloat in a production agent? (Select TWO)","code":null,"options":[{"letter":"A","text":"Two tools have overlapping descriptions, and both plausibly handle 'find a customer'"},{"letter":"B","text":"Each subagent's tools are scoped to its responsibility"},{"letter":"C","text":"The reporting agent uses read-only credentials"},{"letter":"D","text":"It exposes 45 tools, and invocation logs show only 9 ever used"},{"letter":"E","text":"Tool descriptions state when not to use each tool"}],"answer":["A","D"],"explanation":"Unused tools that ship with every request (D) and overlapping tools that blur selection (A) are classic signs of bloat. Scoped toolsets (B), read-only credentials for a read-only job (C) and boundary statements in descriptions (E) are the cure."},{"n":13,"domain":"d3","scenario":null,"stem":"An agent connects to six MCP servers exposing 300 tools, and every request front-loads all of their definitions. Tool selection is poor and costs are high. What is the best fix?","code":null,"options":[{"letter":"A","text":"Add more examples to the system prompt"},{"letter":"B","text":"Shorten every tool description to one line"},{"letter":"C","text":"Move to a model with a larger context window"},{"letter":"D","text":"Progressive discovery: load tool definitions on demand (for example with tool search and deferred loading), and give each agent only the servers its responsibility needs"}],"answer":["D"],"explanation":"Loading tools as the agent narrows in cuts tokens and improves selection accuracy, and scoping servers per responsibility removes tools that never belonged (D). A bigger window (C) holds the same noise. One-line descriptions (B) make selection worse. Examples (A) add tokens without reducing the tool count."},{"n":14,"domain":"d3","scenario":null,"stem":"A company assistant answers questions over the document store using a service account that can read every folder, including HR and legal. A contractor asked about salaries and got an answer. What is the root fix?","code":null,"options":[{"letter":"A","text":"Remove HR documents from the index"},{"letter":"B","text":"Run retrieval and tools with the calling user's identity and permissions, and attribute every access to that user in the logs"},{"letter":"C","text":"Add a system-prompt rule: 'Never discuss salaries'"},{"letter":"D","text":"Filter out responses that contain the word 'salary'"}],"answer":["B"],"explanation":"The shared over-privileged account erased per-user authorization and made every access unattributable, so the fix is acting as the caller (B). C is a probabilistic patch, A breaks legitimate HR use, and D is easy to get around and blocks legitimate answers."},{"n":15,"domain":"d3","scenario":null,"stem":"Engineers search an internal knowledge base with exact error codes such as 'E-4031.' Semantic search returns conceptually similar documents about other errors. What is the best fix?","code":null,"options":[{"letter":"A","text":"A larger embedding model"},{"letter":"B","text":"Hybrid search: keyword matching for exact identifiers combined with semantic search, then re-ranking"},{"letter":"C","text":"Retrieve more chunks per query"},{"letter":"D","text":"Fine-tune the generation model on error codes"}],"answer":["B"],"explanation":"Exact identifiers such as error codes and SKUs need keyword matching, which hybrid search adds alongside semantic retrieval (B). Better embeddings (A) still treat codes as fuzzy meaning. More chunks (C) add noise. The generation model (D) can't fix documents that were never retrieved."},{"n":16,"domain":"d4","scenario":null,"stem":"A contract-extraction service has three complaints: wrong values, slow responses at peak hours, and a rising monthly bill. Which THREE metrics should the monitoring plan track? (Select THREE)","code":null,"options":[{"letter":"A","text":"Field-level accuracy against a labeled dataset"},{"letter":"B","text":"Average response length"},{"letter":"C","text":"p95 and p99 latency"},{"letter":"D","text":"Number of prompt revisions per month"},{"letter":"E","text":"Cost per document and tokens per task"}],"answer":["A","C","E"],"explanation":"Each complaint maps to a metric: wrong values to accuracy (A), slowness to tail latency (C), and the bill to cost per unit of work (E). Prompt revision counts (D) and response length (B) measure activity, and neither shows whether the complaints are fixed."},{"n":17,"domain":"d4","scenario":null,"stem":"A team tuned its prompt against the same 200 examples it uses to report accuracy. Testing shows 98%, and production shows 84%. What went wrong, and what is the fix?","code":null,"options":[{"letter":"A","text":"The eval set leaked into prompt development and inflated the score; tune on a separate development set and report on a held-out set that mirrors production"},{"letter":"B","text":"The model is too small; upgrade the tier"},{"letter":"C","text":"Production traffic is low quality; filter it"},{"letter":"D","text":"200 examples is too few; add 20 more of the same kind"}],"answer":["A"],"explanation":"Tuning against the test set overfits to it, so the score stops predicting production (A). C blames the data the system has to handle. B changes the model without fixing the measurement. D keeps the same leak with a slightly bigger set."},{"n":18,"domain":"d4","scenario":null,"stem":"A team wants to ship a new prompt, new retrieval settings and a tier change together, because 'it felt better in 15 spot checks.' What is the correct approach?","code":null,"options":[{"letter":"A","text":"Run 15 more spot checks"},{"letter":"B","text":"Ask the stakeholders which version they prefer"},{"letter":"C","text":"Test one variable at a time with a success metric and sample size set in advance, then ship each change only on a significant result"},{"letter":"D","text":"Ship all three, since the spot checks were positive"}],"answer":["C"],"explanation":"A clean experiment changes one variable and decides on a metric chosen in advance (C). With three changes at once (D), a win or a loss can't be attributed to anything. Preference (B) and more spot checks (A) are still the feels-better method."},{"n":19,"domain":"d4","scenario":null,"stem":"Traces show the correct policy passages are retrieved, yet answers still state the wrong refund window. Where is the failure, and what is the first fix?","code":null,"options":[{"letter":"A","text":"Raise the number of retrieved passages"},{"letter":"B","text":"The index is stale: rebuild it"},{"letter":"C","text":"Retrieval failure: re-chunk and re-embed the corpus"},{"letter":"D","text":"Generation is poorly grounded: tighten the instructions to answer only from the retrieved passages and cite them, and evaluate faithfulness"}],"answer":["D"],"explanation":"When the right documents arrive and the answer is still wrong, the failure sits in generation and grounding (D). C and B fix retrieval, which the traces show is working. A adds noise to a context that already contains the answer."},{"n":20,"domain":"d4","scenario":null,"stem":"Answers about leave policies leave out exceptions. Traces show the retrieved chunks contain the rule sentence, while the exception sits in the next paragraph, which isn't retrieved. What is the best fix?","code":null,"options":[{"letter":"A","text":"Retrieve 30 chunks instead of 5"},{"letter":"B","text":"Move to a more capable model"},{"letter":"C","text":"Tell the model to remember that policies have exceptions"},{"letter":"D","text":"Re-chunk along the document's structure (whole sections) with some overlap, so rules and their exceptions stay together"}],"answer":["D"],"explanation":"Chunks smaller than the unit of meaning split rules from their qualifiers, so structure-aware chunking fixes the retrieval unit (D). More chunks (A) might catch the exception along with plenty of noise. No model (B) can use a paragraph it never receives, and an instruction (C) can't supply the missing text."},{"n":21,"domain":"d5","scenario":null,"stem":"An agent reads inbound customer emails and can issue refunds. Which TWO controls are deterministic, as opposed to prompt-based? (Select TWO)","code":null,"options":[{"letter":"A","text":"An output filter that blocks any reply containing a full account number"},{"letter":"B","text":"Few-shot examples of the agent declining suspicious requests"},{"letter":"C","text":"A system-prompt rule: 'Never issue large refunds'"},{"letter":"D","text":"A persona instruction: 'You are a careful agent'"},{"letter":"E","text":"Tool permissions that cap a refund at $100 per call and send larger amounts for human approval"}],"answer":["A","E"],"explanation":"Permission limits (E) and output filtering (A) are enforced in code, whatever the model decides. C, D and B shape behavior probabilistically, and a cleverly written email can talk the model past them."},{"n":22,"domain":"d5","scenario":null,"stem":"A moderation pipeline handles 500,000 low-risk comments a day and occasionally receives legal threats. Which human-in-the-loop design fits?","code":null,"options":[{"letter":"A","text":"Have a human review every comment"},{"letter":"B","text":"Automate routine decisions with sampled QA, and route legal threats and cases below system-set thresholds to human reviewers"},{"letter":"C","text":"Remove humans entirely"},{"letter":"D","text":"Let the model escalate whenever its self-reported confidence is low"}],"answer":["B"],"explanation":"Humans go where the risk is high, and sampling covers the routine volume (B). Reviewing everything (A) destroys the efficiency case. C leaves legal threats unhandled. Self-reported confidence (D) is poorly calibrated, so the thresholds have to be set by the system."},{"n":23,"domain":"d5","scenario":null,"stem":"A US telehealth company with patients in the US and Germany plans to use Claude to summarize clinical notes. Which TWO frameworks apply? (Select TWO)","code":null,"options":[{"letter":"A","text":"FedRAMP"},{"letter":"B","text":"HIPAA, for US patients' health information"},{"letter":"C","text":"GDPR, for the personal data of patients in the EU"},{"letter":"D","text":"None, since Claude is a third-party service"},{"letter":"E","text":"Only HIPAA, since the company is based in the US"}],"answer":["B","C"],"explanation":"The framework follows the data type and the jurisdiction: US health data brings HIPAA (B), and processing EU residents' personal data brings GDPR wherever the company is based (C). FedRAMP (A) covers cloud services for US federal agencies. E ignores the German patients, and D confuses using a vendor with being exempt."},{"n":24,"domain":"d5","scenario":null,"stem":"Your observability stack stores full prompts and responses, including customer personal data, in a log platform that 300 engineers can read. What is the risk, and what is the fix?","code":null,"options":[{"letter":"A","text":"Data leakage through logs: redact personal data before logging, restrict access to the people who need it, and set a retention limit"},{"letter":"B","text":"Ask the model to leave personal data out of its responses"},{"letter":"C","text":"Encrypt the stored logs and leave access as it is"},{"letter":"D","text":"No risk, because the logs are internal"}],"answer":["A"],"explanation":"Logs and traces are a leakage channel, so the fix minimizes what's stored and who can see it (A). Internal access (D) still exposes customer data to hundreds of people. Encryption with unchanged access (C) protects the storage while every reader still sees the data. B leaves the personal data in the prompts, and the model can't be relied on to keep it out of responses."},{"n":25,"domain":"d6","scenario":null,"stem":"A vice president asks you to 'make customer support better with AI.' What should you produce first?","code":null,"options":[{"letter":"A","text":"A comparison of model benchmark scores"},{"letter":"B","text":"A working prototype to show next week"},{"letter":"C","text":"Discovery outputs: a measurable success criterion, a constraint inventory, a data and access map, a stakeholder map with decision owners, and a baseline of the current process"},{"letter":"D","text":"A signed vendor contract"}],"answer":["C"],"explanation":"Professional engagements start with discovery, because every later design choice depends on what success means and which constraints apply (C). A prototype (B) built without discovery answers a question nobody has defined. Benchmarks (A) and contracts (D) come after the requirements are known."},{"n":26,"domain":"d6","scenario":null,"stem":"Stakeholders ask for a guarantee that the assistant 'never gives a wrong answer.' What is the appropriate response?","code":null,"options":[{"letter":"A","text":"Commit only to 99.9% uptime"},{"letter":"B","text":"Promise 100% accuracy to secure approval"},{"letter":"C","text":"Refuse to set any accuracy target"},{"letter":"D","text":"Commit to measured targets, such as at least 96% accuracy per slice on a held-out set with an error budget, escalation paths and a remediation plan, and explain that LLM outputs have a measurable error rate"}],"answer":["D"],"explanation":"Probabilistic systems get SLAs built on measured rates, error budgets and remediation (D). B sets up a broken promise. C leaves stakeholders nothing to hold the system to. Uptime (A) says nothing about answer quality."},{"n":27,"domain":"d6","scenario":null,"stem":"Which statement best communicates a model-tier recommendation to business stakeholders?","code":null,"options":[{"letter":"A","text":"'We chose the newest model available.'"},{"letter":"B","text":"'The top tier scores higher on industry benchmarks.'"},{"letter":"C","text":"'The balanced tier resolves 91% of tickets at $0.02 each, and the top tier resolves 93% at $0.08. At a million tickets a month, the extra two points cost about $60,000 a month, so we recommend the balanced tier with escalation for complex tickets.'"},{"letter":"D","text":"'The balanced tier is fine.'"}],"answer":["C"],"explanation":"Architect-level communication puts the trade-off in business terms: outcome, cost, and the recommendation that follows from them (C). B is engineering language with no business meaning. D gives no basis for the decision, and A offers novelty as a reason."},{"n":28,"domain":"d6","scenario":null,"stem":"Which TWO artifacts belong in the handoff to the team that will operate the system? (Select TWO)","code":null,"options":[{"letter":"A","text":"The architect's personal working notes"},{"letter":"B","text":"The kickoff slide deck"},{"letter":"C","text":"A raw export of the project chat channel"},{"letter":"D","text":"Runbooks covering escalation paths and known failure modes"},{"letter":"E","text":"Eval baselines and an inventory of prompts and their versions"}],"answer":["D","E"],"explanation":"Operators need to know how to respond to problems (D) and what normal looks like, along with what is deployed (E). Personal notes (A), kickoff slides (B) and raw chat (C) aren't operational documentation."},{"n":29,"domain":"d7","scenario":null,"stem":"Claude Code runs in your CI pipeline, and the team agrees it must never run git push or curl anywhere the repository is used. Where should this restriction live?","code":null,"options":[{"letter":"A","text":"Each developer's `~/.claude/settings.json`"},{"letter":"B","text":"Deny rules in the committed project settings, such as `Bash(git push *)` and `Bash(curl *)`, which the client enforces"},{"letter":"C","text":"A wiki page"},{"letter":"D","text":"A `CLAUDE.md` instruction"}],"answer":["B"],"explanation":"Permission rules in version-controlled project settings apply everywhere the repository runs, CI included, and the client enforces them (B). User settings (A) don't reach CI or other developers. `CLAUDE.md` (D) is guidance the model weighs. A wiki (C) is invisible to the tooling."},{"n":30,"domain":"d7","scenario":null,"stem":"A platform team built a code-review subagent and a release-notes skill that every repository in the company should use, in the same version. What is the best way to distribute them?","code":null,"options":[{"letter":"A","text":"Package them as a plugin (or deploy them through managed settings), so every developer gets the same versioned definitions"},{"letter":"B","text":"Post the prompt text in a chat channel for developers to copy"},{"letter":"C","text":"Ask each developer to copy the files into `~/.claude/`"},{"letter":"D","text":"Paste both into every repository's `CLAUDE.md`"}],"answer":["A"],"explanation":"Plugins bundle skills and subagents for distribution, and managed settings can push them to the whole organization, which keeps one maintained version (A). Copy-and-paste distribution (B, C) drifts as soon as the originals change. `CLAUDE.md` (D) holds always-on instructions and can't define a subagent or an on-demand skill."}]}]</script>
<script>
(function () {
  "use strict";
  var REPO = "https://github.com/preporato/claude-certification-guide";
  var BANKS = JSON.parse(document.getElementById("banks").textContent);
  var BY_ID = {};
  BANKS.forEach(function (b) { BY_ID[b.id] = b; });
  var app = document.getElementById("app");
  var topLink = document.getElementById("top-link");
  var S = null;        // the running session
  var timerId = null;

  // ---------- helpers ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function rich(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
  function same(a, b) { return a.length === b.length && a.slice().sort().join() === b.slice().sort().join(); }
  function words(n) { return ["zero", "one", "two", "three", "four", "five"][n] || String(n); }
  function joinLetters(l) { return l.length === 2 ? l.join(" and ") : l.join(", "); }
  function roleLine(b) {
    var parts = b.name.replace("Claude Certified ", "").split(" - ");
    return parts.join(" · ");
  }
  function clock(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    var m = Math.floor(s / 60);
    return (m < 10 ? "0" : "") + m + ":" + (s % 60 < 10 ? "0" : "") + (s % 60);
  }
  function getBest(id) {
    try { return JSON.parse(localStorage.getItem("ccg:v1:best:" + id) || "null"); } catch (e) { return null; }
  }
  function saveBest(id, correct, total) {
    try {
      var best = getBest(id);
      if (!best || correct > best.correct) {
        localStorage.setItem("ccg:v1:best:" + id, JSON.stringify({ correct: correct, total: total, at: Date.now() }));
      }
    } catch (e) { /* storage unavailable */ }
  }
  function setTop(b) {
    if (b) {
      topLink.href = b.certPage;
      topLink.innerHTML = "Full " + esc(b.code) + '<span class="long"> practice</span> tests ↗';
    } else {
      topLink.href = REPO;
      topLink.textContent = "GitHub ↗";
    }
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function top() { window.scrollTo(0, 0); }

  // ---------- home ----------
  function viewHome() {
    stopTimer();
    S = null;
    setTop(null);
    document.title = "Claude certification practice test: CCAO-F, CCDV-F, CCA-F, CCAR-P";
    app.innerHTML =
      '<h1>Practice for your Claude certification</h1>' +
      '<p class="lead">30 questions for each of Anthropic’s four certification exams, written in the exam’s style, with an explanation for every answer. ' +
      'Practice at your own pace, or take a timed run and get a score for every domain.</p>' +
      '<div class="grid">' + BANKS.map(card).join("") + '</div>' +
      '<p class="note">Your results link each weak domain to its notes in the <a href="' + REPO + '">study guides</a>. Best scores are saved in this browser only.</p>';
  }
  function card(b) {
    var best = getBest(b.id);
    return '<article class="card">' +
      '<div class="cover" aria-hidden="true"><b>' + esc(b.code) + '</b><span>' + esc(roleLine(b)) + '</span></div>' +
      '<div class="card-body">' +
        '<h2>' + esc(b.name) + '</h2>' +
        '<p class="meta">' + b.questions.length + ' questions · ' + b.domains.length + ' domains · timed run ' + b.minutes + ' minutes</p>' +
        (best ? '<p class="best">Your best: ' + best.correct + ' of ' + best.total + '</p>' : '') +
        '<div class="row">' +
          '<button class="btn btn-dark btn-grow" data-start="' + b.id + '" data-mode="timed">Timed test</button>' +
          '<button class="btn btn-ghost btn-grow" data-start="' + b.id + '" data-mode="practice">Practice</button>' +
        '</div>' +
      '</div></article>';
  }

  // ---------- exam intro (deep links such as #cca-f) ----------
  function viewIntro(b) {
    stopTimer();
    S = null;
    setTop(b);
    document.title = b.code + " practice test · Claude Certification Guide";
    var best = getBest(b.id);
    var multi = b.questions.filter(function (q) { return q.answer.length > 1; }).length;
    app.innerHTML = '<div class="narrow">' +
      '<div class="card" style="margin-top:16px"><div class="cover" aria-hidden="true"><b>' + esc(b.code) + '</b><span>' + esc(roleLine(b)) + '</span></div></div>' +
      '<h1>' + esc(b.code) + ' practice test</h1>' +
      '<p class="lead">' + b.questions.length + ' questions for ' + esc(b.name) + ', spread across the exam’s ' + b.domains.length + ' domains by their official weights. ' +
      multi + ' of them ask for more than one answer, as the exam does; those count only when every choice is right.</p>' +
      (best ? '<p class="best">Your best so far: ' + best.correct + ' of ' + best.total + '</p>' : '') +
      '<div class="row">' +
        '<button class="btn btn-dark btn-grow" data-start="' + b.id + '" data-mode="timed">Timed test (' + b.minutes + ' minutes)</button>' +
        '<button class="btn btn-ghost btn-grow" data-start="' + b.id + '" data-mode="practice">Practice with explanations</button>' +
      '</div>' +
      '<p class="note">The real exam has ' + b.exam.questions + ' questions in ' + b.exam.minutes + ' minutes, so the timed run keeps the same pace of two minutes a question. ' +
      '<a href="./">All four exams</a></p>' +
    '</div>';
  }

  // ---------- quiz ----------
  function start(id, mode, subset) {
    var b = BY_ID[id];
    if (!b) return viewHome();
    stopTimer();
    var idx = subset || b.questions.map(function (_, i) { return i; });
    S = {
      b: b, mode: mode, idx: idx, i: 0, ans: {}, checked: {}, flag: {}, retry: !!subset,
      started: Date.now(), done: false,
      deadline: mode === "timed" ? Date.now() + Math.round(b.minutes * 60000 * idx.length / b.questions.length) : null
    };
    setTop(b);
    document.title = b.code + " " + (mode === "timed" ? "timed test" : "practice") + " · Claude Certification Guide";
    if (S.deadline) {
      timerId = setInterval(function () {
        var left = S.deadline - Date.now();
        var el = document.getElementById("timer");
        if (el) {
          el.textContent = clock(left);
          el.classList.toggle("low", left < 5 * 60000);
        }
        if (left <= 0) finish();
      }, 1000);
    }
    viewQuiz();
    top();
  }

  function current() { return S.b.questions[S.idx[S.i]]; }

  function viewQuiz() {
    var b = S.b, qi = S.idx[S.i], q = b.questions[qi], n = S.idx.length;
    var multi = q.answer.length > 1;
    var chosen = S.ans[qi] || [];
    var checked = S.mode === "practice" && S.checked[qi];
    var scenario = null;
    if (q.scenario) b.scenarios.forEach(function (s) { if (s.id === q.scenario) scenario = s; });
    var domain = null;
    b.domains.forEach(function (d) { if (d.id === q.domain) domain = d; });
    var answeredCount = Object.keys(S.ans).filter(function (k) { return S.ans[k].length; }).length;

    var html = '<div class="narrow">' +
      '<div class="qhead"><span>' + esc(b.code) + ' <span class="mode">· ' + (S.mode === "timed" ? "Timed test" : (S.retry ? "Retry" : "Practice")) + '</span></span>' +
      (S.deadline ? '<span class="timer" id="timer" role="timer" aria-label="Time left">' + clock(S.deadline - Date.now()) + '</span>'
                  : '<span>' + (S.i + 1) + ' / ' + n + '</span>') +
      '</div>' +
      '<div class="bar" aria-hidden="true"><i style="width:' + Math.round(100 * (S.mode === "timed" ? answeredCount : S.i + (checked ? 1 : 0)) / n) + '%"></i></div>';

    if (scenario) {
      html += '<details class="scenario" open><summary>Scenario: ' + esc(scenario.title) + '</summary><p>' + rich(scenario.text) + '</p></details>';
    }
    html += '<p class="qlabel"><b>Question ' + (S.i + 1) + ' of ' + n + '</b> · ' + esc(domain ? domain.name : "") + '</p>' +
      '<p class="stem" id="stem">' + rich(q.stem) + '</p>';
    if (q.code) html += '<pre><code>' + esc(q.code.text) + '</code></pre>';
    if (multi && !checked) html += '<p class="hint" id="hint">Choose ' + words(q.answer.length) + '.</p>';

    html += '<fieldset class="opts' + (multi ? ' multi' : '') + '" aria-labelledby="stem"><legend class="sr-only">Answer options</legend>';
    q.options.forEach(function (o) {
      var isChosen = chosen.indexOf(o.letter) >= 0;
      var cls = "opt";
      if (checked) {
        cls += " locked";
        if (q.answer.indexOf(o.letter) >= 0) cls += " right";
        else if (isChosen) cls += " wrong";
      } else if (isChosen) cls += " sel";
      html += '<label class="' + cls + '"><input type="' + (multi ? "checkbox" : "radio") + '" name="opt" value="' + o.letter + '"' +
        (isChosen ? " checked" : "") + (checked ? " disabled" : "") + '><span class="let" aria-hidden="true">' + o.letter + '</span>' +
        '<span class="txt"><span class="sr-only">' + o.letter + '. </span>' + rich(o.text) + '</span></label>';
    });
    html += '</fieldset>';

    if (checked) {
      var ok = same(chosen, q.answer);
      html += '<div class="feedback" role="status"><h3 class="' + (ok ? "ok" : "bad") + '">' +
        (ok ? "Correct" : "Not quite. The answer is " + joinLetters(q.answer) + ".") + '</h3>' +
        '<p>' + rich(q.explanation) + '</p></div>';
    }

    html += '<div class="actions">';
    if (S.mode === "practice") {
      if (!checked) {
        html += '<button class="btn btn-dark btn-grow" data-act="check"' + (chosen.length === q.answer.length ? "" : " disabled") + '>Check answer</button>';
      } else {
        html += '<button class="btn btn-dark btn-grow" data-act="next">' + (S.i + 1 < n ? "Next question" : "See results") + '</button>';
      }
      html += '<button class="btn btn-ghost" data-act="quit">End practice</button>';
    } else {
      html += '<button class="btn btn-ghost" data-act="prev"' + (S.i === 0 ? " disabled" : "") + '>Back</button>' +
        '<button class="btn btn-ghost" data-act="flag" aria-pressed="' + (S.flag[qi] ? "true" : "false") + '">' + (S.flag[qi] ? "Unflag" : "Flag for review") + '</button>' +
        (S.i + 1 < n ? '<button class="btn btn-dark btn-grow" data-act="next">Next</button>'
                     : '<button class="btn btn-dark btn-grow" data-act="finish">Finish test</button>');
    }
    html += '</div>';

    if (S.mode === "timed") {
      html += '<nav class="nav" aria-label="Questions"><p>' + answeredCount + ' of ' + n + ' answered' +
        (Object.keys(S.flag).filter(function (k) { return S.flag[k]; }).length ? ' · flagged questions have a dot' : '') + '</p><div class="dots">';
      S.idx.forEach(function (qIndex, pos) {
        var cls = "dot";
        if ((S.ans[qIndex] || []).length) cls += " done";
        if (pos === S.i) cls += " cur";
        if (S.flag[qIndex]) cls += " flagged";
        html += '<button class="' + cls + '" data-go="' + pos + '" aria-label="Question ' + (pos + 1) + '"' + (pos === S.i ? ' aria-current="step"' : '') + '>' + (pos + 1) + '</button>';
      });
      html += '</div>' + (S.i + 1 < n ? '<div class="actions"><button class="btn btn-ghost btn-grow" data-act="finish">Finish test</button></div>' : '') + '</nav>';
    }
    html += '</div>';
    app.innerHTML = html;
  }

  function choose(letter) {
    var qi = S.idx[S.i], q = current();
    if (S.mode === "practice" && S.checked[qi]) return;
    var chosen = (S.ans[qi] || []).slice();
    var multi = q.answer.length > 1;
    if (!multi) chosen = [letter];
    else {
      var at = chosen.indexOf(letter);
      if (at >= 0) chosen.splice(at, 1);
      else {
        chosen.push(letter);
        if (chosen.length > q.answer.length) chosen.shift(); // keep the most recent picks
      }
    }
    S.ans[qi] = chosen;
    var focusLetter = letter;
    viewQuiz();
    var input = app.querySelector('input[value="' + focusLetter + '"]');
    if (input) input.focus({ preventScroll: true });
  }

  function act(name) {
    var n = S.idx.length, qi = S.idx[S.i], q = current();
    if (name === "check") {
      if ((S.ans[qi] || []).length !== q.answer.length) return;
      S.checked[qi] = true;
      viewQuiz();
      var fb = app.querySelector(".feedback");
      if (fb) fb.scrollIntoView({ block: "nearest", behavior: "smooth" });
    } else if (name === "next") {
      if (S.i + 1 < n) { S.i++; viewQuiz(); top(); } else finish();
    } else if (name === "prev") {
      if (S.i > 0) { S.i--; viewQuiz(); top(); }
    } else if (name === "flag") {
      S.flag[qi] = !S.flag[qi]; viewQuiz();
    } else if (name === "finish") {
      var unanswered = S.idx.filter(function (k) { return !(S.ans[k] || []).length; }).length;
      if (unanswered && !window.confirm(unanswered + " question" + (unanswered === 1 ? " is" : "s are") + " unanswered. Finish anyway?")) return;
      finish();
    } else if (name === "quit") {
      finish();
    }
  }

  // ---------- results ----------
  function finish() {
    if (!S || S.done) return;
    stopTimer();
    S.done = true;
    S.ended = Date.now();
    viewResults(true);
    top();
  }

  function viewResults(showMissedOnly) {
    var b = S.b;
    var practiceSeen = S.mode === "practice" ? S.idx.filter(function (k) { return S.checked[k]; }) : S.idx;
    var pool = S.mode === "practice" ? practiceSeen : S.idx;
    var total = pool.length;
    var correct = 0, missed = [];
    var per = {};
    b.domains.forEach(function (d) { per[d.id] = { right: 0, total: 0 }; });
    pool.forEach(function (k) {
      var q = b.questions[k];
      var ok = same(S.ans[k] || [], q.answer);
      per[q.domain].total++;
      if (ok) { correct++; per[q.domain].right++; } else missed.push(k);
    });
    if (!S.retry && total === b.questions.length) saveBest(b.id, correct, total);
    var pct = total ? Math.round(100 * correct / total) : 0;
    var minutes = Math.max(1, Math.round((S.ended - S.started) / 60000));

    var html = '<div class="narrow">' +
      '<p class="qhead"><span>' + esc(b.code) + ' <span class="mode">· ' + (S.mode === "timed" ? "Timed test" : (S.retry ? "Retry" : "Practice")) + ' results</span></span></p>';
    if (!total) {
      html += '<h1>No answers yet</h1><p class="lead">Answer at least one question to see a score.</p>' +
        '<div class="actions"><button class="btn btn-dark" data-start="' + b.id + '" data-mode="' + S.mode + '">Start again</button>' +
        '<a class="btn btn-ghost" href="./">All exams</a></div></div>';
      app.innerHTML = html;
      return;
    }
    html += '<p class="score">' + correct + ' / ' + total + '<small>' + pct + '%</small></p>' +
      '<p class="sub">' + (S.mode === "timed" ? "Finished in " + minutes + " minute" + (minutes === 1 ? "" : "s") + "." : "Practice run, " + total + " question" + (total === 1 ? "" : "s") + " checked.") + '</p>' +
      '<p class="fine">The real exam reports a scaled score from 100 to 1000 and passes at 720. Use this percentage to find your weak domains.</p>';

    html += '<section class="panel"><h2>By domain</h2>';
    b.domains.forEach(function (d) {
      var t = per[d.id];
      if (!t.total) return;
      var r = t.right / t.total;
      html += '<div class="drow"><span class="dname">' + esc(d.name) + '</span><span class="dnum">' + t.right + ' of ' + t.total + '</span>' +
        '<div class="bar" aria-hidden="true"><i class="' + (r >= 0.7 ? "good" : "weak") + '" style="width:' + Math.max(4, Math.round(100 * r)) + '%"></i></div>' +
        '<span class="dmeta">' + d.weight + '% of the exam' + (r < 0.7 ? ' · <a href="' + esc(d.guide) + '">Review this domain in the guide</a>' : '') + '</span></div>';
    });
    html += '</section>';

    html += '<section class="cta"><h2>Ready for full length?</h2>' +
      '<p>The ' + esc(b.code) + ' page on Preporato has free sample questions and six full-length timed practice tests (paid) in the exam’s format, with a score for every domain.</p>' +
      '<a class="btn" href="' + esc(b.certPage) + '">Open the ' + esc(b.code) + ' practice tests ↗</a></section>';

    html += '<div class="actions">' +
      (missed.length ? '<button class="btn btn-dark btn-grow" data-act="retry">Retry the ' + missed.length + ' you missed</button>' : '') +
      '<button class="btn btn-ghost btn-grow" data-start="' + b.id + '" data-mode="' + (S.mode === "timed" ? "timed" : "practice") + '">Start over</button>' +
      '<a class="btn btn-ghost btn-grow" href="./">All exams</a></div>';

    var only = showMissedOnly && missed.length > 0;
    html += '<section class="review"><div class="review-head"><h2>Review</h2>' +
      (missed.length ? '<label class="toggle"><input type="checkbox" id="only-missed"' + (only ? " checked" : "") + '> Only the ones I missed</label>' : '') +
      '</div>';
    pool.forEach(function (k) {
      var q = b.questions[k];
      var yours = S.ans[k] || [];
      var ok = same(yours, q.answer);
      if (only && ok) return;
      var pos = S.idx.indexOf(k) + 1;
      html += '<details class="item"><summary><span class="mark ' + (ok ? "ok" : "bad") + '" aria-label="' + (ok ? "Correct" : "Incorrect") + '">' + (ok ? "✓" : "✗") + '</span>' +
        '<span class="q">' + pos + '. ' + rich(q.stem) + '</span></summary><div class="body">' +
        '<p class="yours">Your answer: ' + (yours.length ? joinLetters(yours.slice().sort()) : "none") + ' · Correct: ' + joinLetters(q.answer) + '</p>' +
        '<div class="opts">';
      q.options.forEach(function (o) {
        var cls = "opt locked";
        if (q.answer.indexOf(o.letter) >= 0) cls += " right";
        else if (yours.indexOf(o.letter) >= 0) cls += " wrong";
        html += '<div class="' + cls + '"><span class="let" aria-hidden="true">' + o.letter + '</span><span class="txt"><span class="sr-only">' + o.letter + '. </span>' + rich(o.text) + '</span></div>';
      });
      html += '</div><p class="exp">' + rich(q.explanation) + '</p></div></details>';
    });
    html += '</section></div>';
    app.innerHTML = html;
    S.missed = missed;
  }

  // ---------- events ----------
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (t.name === "opt" && S && !S.done) choose(t.value);
    if (t.id === "only-missed" && S) viewResults(t.checked);
  });
  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-start],[data-act],[data-go]");
    if (!el) return;
    if (el.hasAttribute("data-start")) {
      start(el.getAttribute("data-start"), el.getAttribute("data-mode"));
    } else if (el.hasAttribute("data-go")) {
      S.i = Number(el.getAttribute("data-go")); viewQuiz(); top();
    } else {
      var a = el.getAttribute("data-act");
      if (a === "retry") start(S.b.id, "practice", S.missed.slice());
      else act(a);
    }
  });
  document.addEventListener("keydown", function (e) {
    if (!S || S.done || e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || "").toLowerCase();
    if (tag === "textarea") return;
    var k = e.key.toLowerCase();
    var q = current();
    var map = { a: 0, b: 1, c: 2, d: 3, e: 4, "1": 0, "2": 1, "3": 2, "4": 3, "5": 4 };
    if (k in map && q.options[map[k]]) { e.preventDefault(); choose(q.options[map[k]].letter); return; }
    if (k === "enter" && tag !== "button" && tag !== "a") {
      e.preventDefault();
      var qi = S.idx[S.i];
      if (S.mode === "practice") act(S.checked[qi] ? "next" : "check");
      else act(S.i + 1 < S.idx.length ? "next" : "finish");
    }
  });
  window.addEventListener("beforeunload", function (e) {
    if (S && !S.done && Object.keys(S.ans).length) { e.preventDefault(); e.returnValue = ""; }
  });
  function route() {
    var id = (location.hash || "").replace(/^#\/?/, "").split("/")[0];
    if (S && !S.done && Object.keys(S.ans).length && !window.confirm("Leave this test? Your answers will be lost.")) return;
    if (id && BY_ID[id]) viewIntro(BY_ID[id]); else viewHome();
    top();
  }
  window.addEventListener("hashchange", route);
  route();
})();
</script>
</body>
</html>
