<style>
:root {
  --paper: #F4F4F4; --card: #FFFFFF; --ink: #1A1D1F; --graphite: #33383F; --slate: #676767; --line: #E3E3E3; --line-strong: #C9C9C9;
  --blue: #2A85FF; --blue-deep: #0066F5; --blue-tint: #E8F3FF;
  --cta: #2C2C2C; --cta-hover: #000000; --cta-text: #FFFFFF;
  --ok: #2F7A3A; --ok-line: #83BF6E; --ok-tint: #EAFAE4;
  --bad: #B42318; --bad-line: #FF6A55; --bad-tint: #FFECE8;
  --flag: #FF6A55; --glow: #CC785C;
  --round: Nunito, ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #101010; --card: #191919; --ink: #F1F1F1; --graphite: #D9D9D9; --slate: #A3A3A3; --line: #2C2C2E; --line-strong: #444448;
    --blue-tint: #0F2440; --cta: #F1F1F1; --cta-hover: #FFFFFF; --cta-text: #101010;
    --ok: #7DD27F; --ok-tint: #11291A; --bad: #FF8A7A; --bad-tint: #36160F;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans); }
a { color: var(--blue-deep); }
@media (prefers-color-scheme: dark) { a { color: #6FB0FF; } }
code { font-family: var(--mono); font-size: .86em; background: color-mix(in srgb, var(--ink) 7%, transparent); padding: .08em .35em; border-radius: 5px; overflow-wrap: anywhere; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; max-width: 980px; margin: 0 auto; padding: 16px 20px; }
.brand { font: 800 16px/1.2 var(--round); color: var(--ink); text-decoration: none; letter-spacing: -.005em; }
.top-link { font: 600 14px/1.2 var(--sans); color: var(--graphite); text-decoration: none; white-space: nowrap; }
.top-link:hover, .brand:hover { color: var(--blue-deep); }
@media (max-width: 480px) { .top-link .long { display: none; } }
main { max-width: 980px; margin: 0 auto; padding: 8px 20px 48px; }
.narrow { max-width: 760px; margin: 0 auto; }
footer { max-width: 980px; margin: 0 auto; padding: 24px 20px 40px; color: var(--slate); font-size: 13px; border-top: 1px solid var(--line); }
footer a { color: inherit; }

h1 { font: 900 clamp(28px, 5vw, 40px)/1.12 var(--round); letter-spacing: -.012em; margin: 24px 0 12px; }
.lead { font-size: 18px; color: var(--graphite); max-width: 680px; margin: 0 0 28px; }
.note { color: var(--slate); font-size: 14px; margin: 28px 0 0; }

.grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
@media (min-width: 680px) { .grid { grid-template-columns: 1fr 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; }
.cover { position: relative; aspect-ratio: 16 / 6.4; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; background:
  radial-gradient(60% 85% at 50% 100%, color-mix(in srgb, var(--glow) 38%, transparent), transparent 72%),
  radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 1.6px) 0 0 / 14px 14px,
  linear-gradient(#17171A, #0B0B0C); }
.cover b { font: 900 clamp(34px, 6vw, 46px)/1 var(--round); letter-spacing: -.01em; }
.cover span { margin-top: 10px; font: 600 11px/1.3 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: #A3CFFF; }
.card-body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card h2 { font: 700 17px/1.35 var(--sans); margin: 0; }
.meta { margin: 0; color: var(--slate); font-size: 14px; }
.best { margin: 2px 0 0; font: 700 13px/1.4 var(--round); color: var(--ok); }
.row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 12px; }

.btn { appearance: none; border: 0; border-radius: 11px; min-height: 46px; padding: 0 18px; font: 600 15px/1 var(--sans); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; transition: background-color .15s, border-color .15s, color .15s; }
.btn-dark { background: var(--cta); color: var(--cta-text); }
.btn-dark:hover { background: var(--cta-hover); }
.btn-ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line-strong); }
.btn-ghost:hover { border-color: var(--graphite); }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-grow { flex: 1 1 160px; }

.qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 12px 0 10px; font: 700 14px/1.2 var(--round); color: var(--graphite); }
.qhead .mode { color: var(--slate); font-weight: 700; }
.timer { font: 600 15px/1 var(--mono); padding: 7px 10px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); }
.timer.low { color: var(--bad); border-color: var(--bad-line); }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--blue); border-radius: 3px; }
.scenario { margin: 22px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.scenario summary { cursor: pointer; font: 800 14px/1.35 var(--round); }
.scenario p { margin: 8px 0 0; color: var(--graphite); font-size: 15px; }
.qlabel { margin: 26px 0 6px; font: 700 13px/1.4 var(--round); color: var(--slate); }
.qlabel b { color: var(--ink); }
.stem { font-size: 18px; line-height: 1.55; margin: 0 0 6px; font-weight: 500; }
pre { background: #0B0B0C; color: #E9E9E9; font: 500 13px/1.55 var(--mono); padding: 14px 16px; border-radius: 12px; overflow: auto; margin: 14px 0 6px; }
.hint { font: 700 13px/1.4 var(--round); color: var(--blue-deep); margin: 10px 0 0; }
@media (prefers-color-scheme: dark) { .hint { color: #6FB0FF; } }
.opts { border: 0; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.opt { position: relative; display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: start; padding: 13px 15px; background: var(--card); border: 1.5px solid var(--line); border-radius: 13px; cursor: pointer; transition: border-color .12s, background-color .12s; }
.opt:hover { border-color: var(--line-strong); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt:focus-within { outline: 3px solid var(--blue); outline-offset: 2px; }
.let { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font: 800 14px/1 var(--round); color: var(--graphite); }
.multi .let { border-radius: 8px; }
.txt { padding-top: 4px; }
.opt.sel { border-color: var(--blue); background: var(--blue-tint); }
.opt.sel .let { background: var(--blue); border-color: var(--blue); color: #fff; }
.opt.right { border-color: var(--ok-line); background: var(--ok-tint); }
.opt.right .let { background: var(--ok-line); border-color: var(--ok-line); color: #10240F; }
.opt.wrong { border-color: var(--bad-line); background: var(--bad-tint); }
.opt.wrong .let { background: var(--bad-line); border-color: var(--bad-line); color: #fff; }
.opt.locked { cursor: default; }
.feedback { margin: 18px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.feedback h3 { margin: 0 0 6px; font: 800 16px/1.3 var(--round); }
.feedback h3.ok { color: var(--ok); }
.feedback h3.bad { color: var(--bad); }
.feedback p { margin: 0; color: var(--graphite); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 0; }
.nav { margin: 26px 0 0; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
.nav p { margin: 0 0 10px; font: 700 13px/1.4 var(--round); color: var(--slate); }
.dots { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; }
.dot { position: relative; height: 38px; border-radius: 9px; border: 1.5px solid var(--line-strong); background: transparent; color: var(--graphite); font: 700 13px/1 var(--round); cursor: pointer; }
.dot.done { background: var(--graphite); border-color: var(--graphite); color: var(--card); }
.dot.cur { border-color: var(--blue); box-shadow: 0 0 0 2px var(--blue) inset; }
.dot.flagged::after { content: ""; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--flag); }

.score { font: 900 clamp(44px, 9vw, 64px)/1 var(--round); letter-spacing: -.02em; margin: 18px 0 4px; }
.score small { font-size: .42em; color: var(--slate); font-weight: 800; margin-left: 6px; letter-spacing: 0; }
.sub { color: var(--graphite); margin: 0 0 4px; }
.fine { color: var(--slate); font-size: 14px; margin: 0; }
.panel { margin: 24px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 18px 8px; }
.panel h2 { font: 800 17px/1.3 var(--round); margin: 0 0 12px; }
.drow { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.drow:first-of-type { border-top: 0; }
.dname { font-weight: 600; font-size: 15px; }
.dnum { font: 700 14px/1.4 var(--round); color: var(--graphite); text-align: right; }
.drow .bar { grid-column: 1 / -1; height: 8px; }
.drow .bar > i.good { background: var(--ok-line); }
.drow .bar > i.weak { background: var(--bad-line); }
.dmeta { grid-column: 1 / -1; font-size: 13px; color: var(--slate); }
.cta { margin: 24px 0 0; border-radius: 18px; overflow: hidden; color: #fff; padding: 24px 22px; background:
  radial-gradient(70% 120% at 85% 110%, color-mix(in srgb, var(--glow) 42%, transparent), transparent 70%),
  radial-gradient(circle at 1px 1px, rgba(255,255,255,.07) 1px, transparent 1.6px) 0 0 / 14px 14px,
  linear-gradient(#17171A, #0B0B0C); }
.cta h2 { font: 900 22px/1.2 var(--round); margin: 0 0 8px; }
.cta p { margin: 0 0 16px; color: #D6D6D6; max-width: 560px; }
.cta .btn { background: #fff; color: #101010; }
.cta .btn:hover { background: #EDEDED; }
.review { margin: 24px 0 0; }
.review-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.review-head h2 { font: 800 17px/1.3 var(--round); margin: 0; }
.toggle { font-size: 14px; color: var(--graphite); display: inline-flex; gap: 8px; align-items: center; cursor: pointer; }
.item { margin: 10px 0 0; background: var(--card); border: 1px solid var(--line); border-radius: 13px; }
.item summary { list-style: none; cursor: pointer; padding: 13px 15px; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; }
.item summary::-webkit-details-marker { display: none; }
.mark { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 900 13px/1 var(--round); }
.mark.ok { background: var(--ok-tint); color: var(--ok); }
.mark.bad { background: var(--bad-tint); color: var(--bad); }
.item .q { font-size: 15px; }
.item .body { padding: 0 15px 15px 51px; }
.item .opts { margin-top: 4px; }
.item .opt { cursor: default; padding: 10px 12px; }
.item .exp { margin: 12px 0 0; color: var(--graphite); }
.yours { font: 700 13px/1.4 var(--round); color: var(--slate); margin: 0 0 8px; }
@media (max-width: 520px) {
  .item .body { padding-left: 15px; }
  .stem { font-size: 17px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script id="banks" type="application/json">[{"id":"ccao-f","code":"CCAO-F","name":"Claude Certified Associate - Foundations","certPage":"https://preporato.com/certificates/claude-certified-associate-foundations","guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md","exam":{"questions":60,"minutes":120},"minutes":60,"domains":[{"id":"d1","name":"Output Evaluation and Validation","weight":21,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-1-output-evaluation--validation-21"},{"id":"d2","name":"Workflow Integration and Solution Design","weight":16,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-2-workflow-integration--solution-design-16"},{"id":"d3","name":"Governance, Risk, and Responsible Use","weight":15,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-3-governance-risk--responsible-use-15"},{"id":"d4","name":"Prompting and Task Execution","weight":14,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-4-prompting--task-execution-14"},{"id":"d5","name":"Product and Model Selection","weight":12,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-5-product--model-selection-12"},{"id":"d6","name":"Configuration and Knowledge Management","weight":12,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-6-configuration--knowledge-management-12"},{"id":"d7","name":"Troubleshooting and Optimization","weight":10,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccao-f/guide.md#domain-7-troubleshooting--optimization-10"}],"scenarios":[],"questions":[{"n":1,"domain":"d1","scenario":null,"stem":"Claude summarized a 30-page vendor contract you attached and wrote: 'The contract auto-renews for 24 months unless cancelled 90 days before expiry.' This line is going into an email to your director. What is the most efficient way to check it?","code":null,"options":[{"letter":"A","text":"Ask Claude to quote the exact clause and give its section number, then read that clause in the contract yourself"},{"letter":"B","text":"Ask Claude whether it's sure"},{"letter":"C","text":"Regenerate the summary and see whether the line comes back the same"},{"letter":"D","text":"Send it as is, because the contract was attached"}],"answer":["A"],"explanation":"A grounded claim can point to its evidence, so asking for the clause and reading it yourself is fast and conclusive (A). Asking for reassurance (B) gets a fluent answer either way. Consistency across regenerations (C) doesn't prove accuracy. An attached source (D) lowers the risk of errors without removing it, and this line describes a contract commitment."},{"n":2,"domain":"d1","scenario":null,"stem":"Claude drafted a job ad for a software engineer that uses phrases like 'young, energetic team' and 'digital native.' What is the issue, and what should you do?","code":null,"options":[{"letter":"A","text":"Nothing; these phrases are standard in job ads"},{"letter":"B","text":"The wording signals an age preference, which can discourage qualified applicants and create legal risk; ask for inclusive wording and check it against your hiring policy"},{"letter":"C","text":"The ad is too long; ask for a shorter version"},{"letter":"D","text":"The tone is too casual for a job ad; ask for a formal rewrite"}],"answer":["B"],"explanation":"Evaluating output covers bias as well as factual errors, and age-coded language in a job ad is a real fairness and compliance problem (B). D and C change the style and keep the biased phrases. A confuses a common phrase with an acceptable one."},{"n":3,"domain":"d1","scenario":null,"stem":"Claude built a pricing comparison table with totals calculated from 40 line items you pasted in. The table is going into a client proposal. What validation is needed?","code":null,"options":[{"letter":"A","text":"Round the totals so small differences don't matter"},{"letter":"B","text":"Nothing, because you supplied the numbers"},{"letter":"C","text":"Recompute the totals independently, for example in a spreadsheet, before the proposal goes out"},{"letter":"D","text":"Ask Claude to double-check its math in the same chat"}],"answer":["C"],"explanation":"Precise arithmetic over many figures is a weak fit to accept unchecked, and a client-facing proposal makes the numbers consequential, so they get verified independently (C). The same process checking itself (D) isn't an independent check. Correct inputs (B) don't guarantee correct sums. Rounding (A) hides errors."},{"n":4,"domain":"d1","scenario":null,"stem":"Claude wrote a market summary with no sources attached. Which TWO details are hallucination red flags? (Select TWO)","code":null,"options":[{"letter":"A","text":"'According to a 2025 McKinsey survey, 73% of retailers plan to...' with no link or attached source"},{"letter":"B","text":"A general explanation of what market share means"},{"letter":"C","text":"A precise figure for next quarter's market size, stated as fact"},{"letter":"D","text":"A note that Claude can't see your internal sales data"},{"letter":"E","text":"A suggestion to verify the figures before publishing"}],"answer":["A","C"],"explanation":"A named study with a precise statistic and no source (A), and a confident, specific figure about the future (C), fit the red-flag profile: precision and authority without grounding. A general definition (B) is low risk, and E and D are signs of honest, calibrated output."},{"n":5,"domain":"d1","scenario":null,"stem":"Claude summarized a customer interview and wrote: 'The customer is frustrated with onboarding and plans to cancel.' The transcript mentions onboarding friction but says nothing about cancelling. What is the problem?","code":null,"options":[{"letter":"A","text":"Nothing; it's a reasonable reading of the frustration"},{"letter":"B","text":"The summary is too short"},{"letter":"C","text":"The summary needs a more formal tone"},{"letter":"D","text":"An unsupported inference is presented as fact; edit the line to what the transcript supports, or label it clearly as an interpretation"}],"answer":["D"],"explanation":"Details beyond the source are a hallucination red flag, and a cancellation claim could trigger real business decisions, so the output has to match its evidence (D). A plausible reading (A) still isn't supported by the transcript. B and C are style issues."},{"n":6,"domain":"d1","scenario":null,"stem":"Research mode returns a summary of a new data regulation with eight cited sources. Your compliance team will base a plan on it. Which TWO steps are needed before anyone uses it? (Select TWO)","code":null,"options":[{"letter":"A","text":"Ask Claude to rate the reliability of each source"},{"letter":"B","text":"Have the compliance owner review the conclusions before the plan is built on them"},{"letter":"C","text":"Open the cited sources and confirm that each key claim matches what the source says, and that the sources are current and authoritative"},{"letter":"D","text":"Run research mode again and keep the claims that appear twice"},{"letter":"E","text":"Nothing; the citations prove the summary is accurate"}],"answer":["B","C"],"explanation":"Citations make claims checkable, which helps only if someone checks them (C), and regulatory content goes through a qualified reviewer (B). Citations alone (E) don't prove the summary represents its sources correctly. Repeated claims (D) show consistency, which isn't accuracy. Claude grading its own sources (A) is no independent check."},{"n":7,"domain":"d2","scenario":null,"stem":"Your manager wants to roll Claude out to all 200 employees next week for every kind of task. What do you recommend?","code":null,"options":[{"letter":"A","text":"Let each employee figure it out without guidance"},{"letter":"B","text":"Roll it out to everyone at once to build momentum"},{"letter":"C","text":"Pilot one or two well-defined workflows with a small group, measure before and after (time spent, error rate), then expand"},{"letter":"D","text":"Wait until AI tools stop making mistakes"}],"answer":["C"],"explanation":"A measured pilot shows the real value and the limits on a small scale before the whole company depends on it (C). A big-bang rollout (B) spreads untested habits everywhere at once. D waits for something that won't happen. A produces uneven quality and no evidence."},{"n":8,"domain":"d2","scenario":null,"stem":"Which TWO tasks are strong fits for Claude in a marketing team's workflow? (Select TWO)","code":null,"options":[{"letter":"A","text":"Turning a webinar transcript into a blog draft and three social posts"},{"letter":"B","text":"Deciding which agency gets a $200,000 contract"},{"letter":"C","text":"Reconciling 5,000 ad-spend transactions with no independent check"},{"letter":"D","text":"Reporting a competitor's announcement from yesterday, from memory"},{"letter":"E","text":"Drafting five subject-line variants for an A/B test"}],"answer":["A","E"],"explanation":"Drafting variants (E) and repurposing content across channels (A) are classic strong fits, with a person reviewing the output. A spending decision (B) needs human accountability, precise reconciliation at volume (C) belongs in a spreadsheet or finance system, and yesterday's news (D) is beyond the model's knowledge unless research mode grounds it."},{"n":9,"domain":"d2","scenario":null,"stem":"You're presenting a Claude pilot to leadership. Which framing is most appropriate?","code":null,"options":[{"letter":"A","text":"'Meeting summaries now take 10 minutes instead of 45. The meeting owner still reviews each one, because outputs can contain errors.'"},{"letter":"B","text":"'Claude eliminates errors from our summaries.'"},{"letter":"C","text":"'Claude will replace the operations team.'"},{"letter":"D","text":"'The benefits can't really be measured.'"}],"answer":["A"],"explanation":"Good stakeholder communication pairs a concrete, measured benefit with an honest limitation (A). B promises something no probabilistic system delivers. C overstates the role and invites resistance. D gives leadership nothing to decide with."},{"n":10,"domain":"d2","scenario":null,"stem":"A colleague opens Claude and types 'help me with the Q3 board deck.' The results are unfocused. What should be defined before prompting?","code":null,"options":[{"letter":"A","text":"The slide color scheme"},{"letter":"B","text":"Nothing; Claude should infer it"},{"letter":"C","text":"Which model to use"},{"letter":"D","text":"The deliverable, the audience, the source material and what a good result looks like"}],"answer":["D"],"explanation":"Solution design starts from the task: what you need, for whom, from which sources, and how you'll judge it (D). Model choice (C) comes later and won't rescue an undefined task. Claude can't infer goals nobody has stated (B). Colors (A) are a detail of the deliverable."},{"n":11,"domain":"d2","scenario":null,"stem":"A legal team handles NDAs in five steps: intake, first-pass review against the team's playbook, negotiation, approval and signature. Where does Claude add the most value with the right safeguards?","code":null,"options":[{"letter":"A","text":"Signing on the company's behalf"},{"letter":"B","text":"First-pass review: compare each NDA to the playbook and flag deviations for a lawyer to decide on"},{"letter":"C","text":"Final approval"},{"letter":"D","text":"Negotiating directly with the other party, unsupervised"}],"answer":["B"],"explanation":"Claude fits the draft-and-analyze stage, with a qualified person keeping the decision (B). Approval (C), signature (A) and unsupervised negotiation (D) would put legal accountability on a tool."},{"n":12,"domain":"d3","scenario":null,"stem":"You want Claude to summarize an internal incident report that contains customers' names and email addresses. Your company's AI policy allows internal documents and prohibits customer personal data. What do you do?","code":null,"options":[{"letter":"A","text":"Paste it in and ask Claude to ignore the names"},{"letter":"B","text":"Paste it in, because it's an internal document"},{"letter":"C","text":"Use the most capable model so the data stays safe"},{"letter":"D","text":"Remove or anonymize the customer details first (the summary doesn't need them), then summarize"}],"answer":["D"],"explanation":"Check the policy before pasting: the report is allowed, the customer data isn't, and the task works without it (D). Being internal (B) doesn't change the personal-data rule. Model choice (C) has nothing to do with data handling. Asking Claude to ignore data (A) comes after you've already shared it."},{"n":13,"domain":"d3","scenario":null,"stem":"A sales rep wants to upload a prospect's RFP, marked confidential, so Claude can help draft the response. Your AI policy says nothing about third-party confidential documents. What is the best action?","code":null,"options":[{"letter":"A","text":"Ask the policy owner or legal before uploading, and treat the document as sensitive until there's an answer"},{"letter":"B","text":"Upload only the pages that look less sensitive"},{"letter":"C","text":"Upload it, since the policy doesn't forbid it"},{"letter":"D","text":"Rewrite the RFP from memory and upload that"}],"answer":["A"],"explanation":"When the policy doesn't cover a case, escalate to the policy owner and stay on the cautious side in the meantime (A). Silence in the policy (C) doesn't amount to approval. Partial uploads (B) and paraphrasing from memory (D) still share confidential content, and the rewrite adds errors."},{"n":14,"domain":"d3","scenario":null,"stem":"Your organization requires disclosure when AI helps produce external content. You drafted a customer newsletter with Claude and then edited it heavily. What applies?","code":null,"options":[{"letter":"A","text":"Disclose only if a customer asks"},{"letter":"B","text":"Follow the disclosure rule as written, because your edits don't change how the draft was produced"},{"letter":"C","text":"Describe the newsletter as written and fact-checked without AI"},{"letter":"D","text":"Skip disclosure, because your edits make it your own work"}],"answer":["B"],"explanation":"Transparency rules apply as written (B). Editing (D) doesn't remove the requirement, disclosure on request (A) isn't what the policy says, and C misrepresents how the work was made."},{"n":15,"domain":"d3","scenario":null,"stem":"Which TWO uses make Claude the decision-maker in a situation where a qualified person must own the call? (Select TWO)","code":null,"options":[{"letter":"A","text":"Brainstorming names for a team offsite"},{"letter":"B","text":"Using Claude's ranking alone to decide which employees are laid off"},{"letter":"C","text":"Drafting three versions of an internal FAQ for a manager to choose from"},{"letter":"D","text":"Sending Claude's answer about a customer's legal rights to the customer without legal review"},{"letter":"E","text":"Summarizing your own meeting notes"}],"answer":["B","D"],"explanation":"Decisions that affect people's livelihoods (B) or legal standing (D) need a qualified human to own them, however good the draft looks. C, A and E are drafting and organizing work where a person still chooses what to use."},{"n":16,"domain":"d3","scenario":null,"stem":"A financial advisory firm uses Claude to draft client emails that explain investment options. Which control is essential?","code":null,"options":[{"letter":"A","text":"Using the most capable model"},{"letter":"B","text":"A disclaimer at the bottom of every email, with no review"},{"letter":"C","text":"Compliance review of client-facing investment content before it's sent, including a check of every figure"},{"letter":"D","text":"Sending the drafts faster to improve service"}],"answer":["C"],"explanation":"Investment explanations are regulated advice, so qualified review comes before sending (C). A stronger model (A) doesn't change who is accountable. A disclaimer (B) can't replace the review that regulation requires. Speed (D) is beside the point."},{"n":17,"domain":"d4","scenario":null,"stem":"Your prompt 'Write an email about the new expense tool' produced something generic. Which TWO additions would improve it most? (Select TWO)","code":null,"options":[{"letter":"A","text":"The tool's key facts, attached or pasted in: launch date, how to get access, where to get help"},{"letter":"B","text":"A switch to the most capable model"},{"letter":"C","text":"A request for ten versions"},{"letter":"D","text":"Who the email is for and what it should get them to do"},{"letter":"E","text":"'Make it amazing'"}],"answer":["A","D"],"explanation":"Generic output comes from missing context, and the audience and goal (D) and the source material (A) are two of the five parts of a complete business prompt. Enthusiasm (E) adds no information. More versions (C) of an underspecified email are more generic emails. A stronger model (B) still can't know facts you didn't give it."},{"n":18,"domain":"d4","scenario":null,"stem":"You need a 20-page market analysis with competitor profiles, a pricing comparison and recommendations. One big prompt produced a shallow result. What is the best approach?","code":null,"options":[{"letter":"A","text":"Rewrite the single prompt with every requirement in capitals"},{"letter":"B","text":"Break it into steps: agree on an outline, draft each section from its sources, then do a final pass for consistency and tone"},{"letter":"C","text":"Regenerate until a deeper version appears"},{"letter":"D","text":"Ask for 'much more detail'"}],"answer":["B"],"explanation":"Multi-part deliverables work better as a sequence of smaller steps you can check (B). D and A keep the one-giant-prompt problem. C is regenerate-and-hope."},{"n":19,"domain":"d4","scenario":null,"stem":"Claude's first draft of a customer apology is too long and too formal. Which follow-up works best?","code":null,"options":[{"letter":"A","text":"Regenerate the response"},{"letter":"B","text":"Start a new chat with the same prompt"},{"letter":"C","text":"'Cut this to about 120 words, make the tone warmer and more direct, keep the refund details, and apologize in the first sentence.'"},{"letter":"D","text":"'Make it better.'"}],"answer":["C"],"explanation":"Specific feedback gives Claude concrete changes to make (C). D gives it nothing to act on, and A and B roll the dice again on an unchanged request."},{"n":20,"domain":"d4","scenario":null,"stem":"You want campaign ideas for a product launch. Which prompting strategy fits brainstorming?","code":null,"options":[{"letter":"A","text":"Give no context, so Claude is unconstrained"},{"letter":"B","text":"Ask for ideas with final budgets attached"},{"letter":"C","text":"Ask for the single best idea"},{"letter":"D","text":"Ask for many varied ideas first (say, 20 across different angles), then evaluate and narrow them with your criteria in a follow-up"}],"answer":["D"],"explanation":"Brainstorming works best as volume and variety first, then judgment (D). Asking for one best idea (C) skips the exploration. Budgets (B) belong to a later planning step. With no context (A), the ideas won't fit your product or audience."},{"n":21,"domain":"d5","scenario":null,"stem":"You need a project timeline that you'll revise with Claude over several rounds and then share with your team. Which output format fits?","code":null,"options":[{"letter":"A","text":"An Artifact: a standalone deliverable in its own panel that you can refine and share"},{"letter":"B","text":"A screenshot of the chat"},{"letter":"C","text":"Research mode"},{"letter":"D","text":"A plain chat reply you copy out each time"}],"answer":["A"],"explanation":"Artifacts are made for standalone deliverables you'll iterate on and share (A). Chat replies (D) suit quick answers. Research mode (C) finds current sources. A screenshot (B) can't be edited."},{"n":22,"domain":"d5","scenario":null,"stem":"Which TWO tasks justify Opus over Sonnet? (Select TWO)","code":null,"options":[{"letter":"A","text":"Summarizing a short meeting"},{"letter":"B","text":"A strategy recommendation that synthesizes six long reports, where an error would be expensive"},{"letter":"C","text":"Writing a two-line reply to a colleague"},{"letter":"D","text":"Working out how obligations interact across five related contracts before a high-stakes negotiation"},{"letter":"E","text":"Reformatting a list of 30 names into a table"}],"answer":["B","D"],"explanation":"Opus is for complex, high-stakes reasoning across a lot of material (B, D). Sonnet is the everyday default, and quick, simple tasks like E, C and A suit Sonnet or Haiku."},{"n":23,"domain":"d5","scenario":null,"stem":"You need to sort 400 short customer comments into five well-defined themes today. Speed matters more than nuance. Which approach fits?","code":null,"options":[{"letter":"A","text":"Haiku with the five themes clearly defined, followed by a spot-check of a sample"},{"letter":"B","text":"One comment per chat, so each gets full attention"},{"letter":"C","text":"Opus for maximum quality on every comment"},{"letter":"D","text":"Research mode"}],"answer":["A"],"explanation":"Quick, well-defined tasks at volume are Haiku's case, and a sample check keeps the quality honest (A). Opus (C) spends time and cost on a task that doesn't need deep reasoning. Research mode (D) searches for current sources, which this task doesn't need. B wastes hours."},{"n":24,"domain":"d5","scenario":null,"stem":"A long chat about a proposal has become slow, and Claude has started mixing up details from early drafts with the current version. What is the best move?","code":null,"options":[{"letter":"A","text":"Switch to Haiku for speed"},{"letter":"B","text":"Paste the entire chat history into a new chat"},{"letter":"C","text":"Start a new chat with a short summary of the current decisions and the latest draft, and keep reference documents in Project knowledge"},{"letter":"D","text":"Keep going and correct each mistake as it appears"}],"answer":["C"],"explanation":"Restart, summarize and persist is the fix for an overloaded chat: a fresh context with only what matters (C). D keeps the overload, B moves it to a new chat, and A changes speed without fixing the mix-ups."},{"n":25,"domain":"d6","scenario":null,"stem":"In a team Project, where should each of these go: (1) 'Always write in British English and use our headline format'; (2) the 40-page brand guidelines PDF; (3) the brief for this week's campaign?","code":null,"options":[{"letter":"A","text":"(1) The chat prompt, (2) the chat prompt, (3) Project knowledge"},{"letter":"B","text":"(1) Project instructions, (2) the chat prompt, (3) Project knowledge"},{"letter":"C","text":"(1) Project knowledge, (2) Project instructions, (3) Project instructions"},{"letter":"D","text":"(1) Project instructions, (2) Project knowledge, (3) the chat prompt"}],"answer":["D"],"explanation":"Standing rules go in instructions, reference documents go in knowledge, and details for one task go in the chat (D). C swaps rules and documents and makes a one-week brief permanent. A retypes standing rules every time. B re-uploads the guidelines in every chat and stores a temporary brief permanently."},{"n":26,"domain":"d6","scenario":null,"stem":"Your weekly report draws on a Google Doc of sales notes that the team updates daily. You've been uploading a copy every Monday, and sometimes it's out of date. What is the better setup?","code":null,"options":[{"letter":"A","text":"Copy the notes into the Project instructions"},{"letter":"B","text":"Connect Google Drive so Claude reads the current version of the document"},{"letter":"C","text":"Upload a copy twice a week"},{"letter":"D","text":"Paste the notes from memory"}],"answer":["B"],"explanation":"Connectors suit material that lives in another tool and changes often, so Claude reads the current version (B). More frequent uploads (C) shrink the gap without closing it. Memory (D) adds errors. Instructions (A) hold standing rules, and pasted notes there go stale just as fast."},{"n":27,"domain":"d6","scenario":null,"stem":"A Project keeps quoting last year's prices. Both the 2025 and the 2026 price sheets are in Project knowledge. What fixes this?","code":null,"options":[{"letter":"A","text":"Remove or replace the outdated price sheet, and if both must stay, state in the instructions which one is current"},{"letter":"B","text":"Use research mode for prices"},{"letter":"C","text":"Correct Claude in every chat"},{"letter":"D","text":"Switch to Opus"}],"answer":["A"],"explanation":"Stale knowledge produces confidently outdated answers, so the fix is maintaining the knowledge itself (A). Correcting every chat (C) never ends. A stronger model (D) still reads both sheets. Your prices are internal, so searching for them (B) won't find the right ones."},{"n":28,"domain":"d7","scenario":null,"stem":"You asked for 'a table comparing vendors,' and each time the columns come out different. What is the most effective fix?","code":null,"options":[{"letter":"A","text":"Ask for 'a better table'"},{"letter":"B","text":"Show the exact structure: list the columns in order, or paste a sample row, and ask Claude to follow it"},{"letter":"C","text":"Regenerate until the columns match"},{"letter":"D","text":"Switch to Opus"}],"answer":["B"],"explanation":"A wrong format every time means the format was described vaguely, and a concrete example fixes that (B). C is regenerate-and-hope, D changes the model without clarifying the request, and A is still vague."},{"n":29,"domain":"d7","scenario":null,"stem":"Claude answered a question about your company's travel reimbursement limits using general industry norms. The real policy is a PDF on the shared drive. What is the best fix?","code":null,"options":[{"letter":"A","text":"Tell Claude its answer is wrong and ask it to try again"},{"letter":"B","text":"Switch to Opus"},{"letter":"C","text":"Attach the policy (or add it to Project knowledge) and ask Claude to answer from it, quoting the relevant section"},{"letter":"D","text":"Ask the same question again with more emphasis"}],"answer":["C"],"explanation":"Confident but wrong claims about your own business come from missing source material, so give Claude the policy and ask for the quote (C). Emphasis (D) and a stronger model (B) can't produce a policy Claude hasn't seen. Telling Claude it's wrong (A) without the policy gets you a different guess."},{"n":30,"domain":"d7","scenario":null,"stem":"On Monday you changed a Project's instructions, switched the model and uploaded new knowledge files. Since then, the outputs are worse. What should you do?","code":null,"options":[{"letter":"A","text":"Change everything again"},{"letter":"B","text":"Delete the Project and start over"},{"letter":"C","text":"Ask Claude what went wrong"},{"letter":"D","text":"Roll back, then reapply one change at a time and compare the results on the same test inputs"}],"answer":["D"],"explanation":"With three changes at once, you can't tell which one hurt quality, so change one variable at a time against the same inputs (D). A adds more confusion, C asks Claude to explain configuration changes it can't observe, and B throws away a setup that worked before Monday."}]},{"id":"ccdv-f","code":"CCDV-F","name":"Claude Certified Developer - Foundations","certPage":"https://preporato.com/certificates/claude-certified-developer-foundations","guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md","exam":{"questions":53,"minutes":120},"minutes":60,"domains":[{"id":"d1","name":"Applications and Integration","weight":33,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-1-applications-and-integration-33"},{"id":"d2","name":"Model Selection and Optimization","weight":17,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-2-model-selection-and-optimization-17"},{"id":"d3","name":"Agents and Workflows","weight":15,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-3-agents-and-workflows-15"},{"id":"d4","name":"Prompt and Context Engineering","weight":11,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-4-prompt-and-context-engineering-11"},{"id":"d5","name":"Tools and MCPs","weight":10,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-5-tools-and-mcps-10"},{"id":"d6","name":"Security and Safety","weight":8,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-6-security-and-safety-8"},{"id":"d7","name":"Claude Code","weight":3,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-7-claude-code-3"},{"id":"d8","name":"Eval, Testing, and Debugging","weight":3,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/ccdv-f/guide.md#domain-8-eval-testing-and-debugging-3"}],"scenarios":[],"questions":[{"n":1,"domain":"d1","scenario":null,"stem":"A chatbot sends only the newest user message to the API on each turn. Users complain that it forgets what they said two messages earlier. What fixes this?","code":null,"options":[{"letter":"A","text":"Raise `max_tokens`"},{"letter":"B","text":"Switch to a model with a larger context window"},{"letter":"C","text":"Enable prompt caching so earlier turns are remembered"},{"letter":"D","text":"Send the conversation history, alternating user and assistant turns, with every request"}],"answer":["D"],"explanation":"The Messages API is stateless: the history you send is the model's entire memory of the conversation (D). Caching (C) makes repeated prefixes cheaper and faster, and it only applies to content you actually send. `max_tokens` (A) limits output length. A larger window (B) is useless when the earlier turns are never included."},{"n":2,"domain":"d1","scenario":null,"stem":"Which `stop_reason` tells you the response ended because it filled the model's context window, as opposed to hitting the `max_tokens` value you set?","code":null,"options":[{"letter":"A","text":"`pause_turn`"},{"letter":"B","text":"`model_context_window_exceeded`"},{"letter":"C","text":"`end_turn`"},{"letter":"D","text":"`max_tokens`"}],"answer":["B"],"explanation":"B means the response ran into the model's context window limit. D means it hit your own `max_tokens` cap. A means a server-side tool loop paused and should be continued, and C means Claude finished naturally. The first two both mean the output may be incomplete and shouldn't be parsed as a finished answer."},{"n":3,"domain":"d1","scenario":null,"stem":"Which TWO problems does streaming solve? (Select TWO)","code":null,"options":[{"letter":"A","text":"Rate-limit errors during traffic peaks"},{"letter":"B","text":"High token prices on long outputs"},{"letter":"C","text":"Users waiting several seconds for the first words of a chat reply"},{"letter":"D","text":"Answers that contain factual errors"},{"letter":"E","text":"HTTP timeouts on requests with very large `max_tokens` values"}],"answer":["C","E"],"explanation":"Streaming sends tokens as they're generated, which shortens perceived latency (C) and keeps long-running requests alive instead of waiting on one large response (E). It doesn't change token pricing (B), accuracy (D) or rate limits (A)."},{"n":4,"domain":"d1","scenario":null,"stem":"Your app sends a different subset of 30 tools on each request depending on the user's plan, and the order of the tool list varies between requests. The system prompt is identical every time, yet the cache hit rate is near zero. Why?","code":null,"options":[{"letter":"A","text":"The system prompt must be placed before the tools to be cached"},{"letter":"B","text":"Requests that include tools can't be cached"},{"letter":"C","text":"Tools come first in the cache prefix, so any change to the tool list or its order invalidates everything after it, including the system prompt; send a stable, consistently ordered tool list per plan"},{"letter":"D","text":"The 5-minute cache lifetime is too short and needs the 1-hour option"}],"answer":["C"],"explanation":"The cache is a prefix match in a fixed order (tools, then system, then messages), so a changing tool list breaks the prefix at its very start (C). The order of those sections isn't yours to choose (A), tools are cacheable (B), and a longer lifetime (D) doesn't help a prefix that never repeats."},{"n":5,"domain":"d1","scenario":null,"stem":"You add `cache_control` to a 600-token system prompt on a model whose minimum cacheable length is 1,024 tokens. Both `cache_creation_input_tokens` and `cache_read_input_tokens` stay at 0, and the API returns no error. What is happening?","code":null,"options":[{"letter":"A","text":"The prefix is below the model's minimum cacheable length, so the request is processed without caching and no error is raised"},{"letter":"B","text":"The cache expired between requests"},{"letter":"C","text":"The API needs a beta header to enable caching"},{"letter":"D","text":"`cache_control` only works in batch requests"}],"answer":["A"],"explanation":"Prompts shorter than the model's minimum cacheable length are processed normally without caching, and the API doesn't report an error, which is why checking the usage fields matters (A). Caching works for regular requests (D). An expired cache (B) would still show cache_creation tokens when the entry is written again. No beta header is needed (C)."},{"n":6,"domain":"d1","scenario":null,"stem":"A nightly batch of 5,000 requests shares a 20,000-token system prompt. Batches can take longer than five minutes to process. How should prompt caching be set up?","code":null,"options":[{"letter":"A","text":"Mark the shared prefix with the 1-hour cache duration and accept its higher write price for better hit rates across the batch"},{"letter":"B","text":"Put the system prompt after the messages so it caches last"},{"letter":"C","text":"Skip caching, because it can't be combined with batches"},{"letter":"D","text":"Keep the default 5-minute duration, since it's always the cheapest option"}],"answer":["A"],"explanation":"Anthropic's documentation recommends the 1-hour duration for batches because their requests can be processed over a longer window, and cache hits on batches are best-effort (A). With the 5-minute default (D), entries can expire between requests. Caching does work with batches (C). The system prompt's position in the request (B) is fixed."},{"n":7,"domain":"d1","scenario":null,"stem":"Your batch job writes results to the database in the order they come back, pairing each with the input at the same position. Some records end up with another record's classification. Why?","code":null,"options":[{"letter":"A","text":"The batch expired before all requests finished"},{"letter":"B","text":"Results are only kept for 29 days"},{"letter":"C","text":"Batch results can come back in any order; match each result to its request by `custom_id`"},{"letter":"D","text":"Sampling makes the classifications non-deterministic"}],"answer":["C"],"explanation":"Results aren't guaranteed to follow request order, which is why every request carries a `custom_id` (C). An expired batch (A) produces 'expired' results, which wouldn't swap labels between records. Non-determinism (D) can change a label but doesn't explain systematic mismatches. Retention (B) is unrelated."},{"n":8,"domain":"d1","scenario":null,"stem":"A downstream parser broke after your model outputs changed format overnight. Nobody touched the code. Which TWO practices prevent this kind of silent change? (Select TWO)","code":null,"options":[{"letter":"A","text":"Pin a specific model version in production and upgrade on purpose after running evals"},{"letter":"B","text":"Keep prompts under version control (or in a prompt registry) and run evals before changing them"},{"letter":"C","text":"Edit prompts directly in production for speed"},{"letter":"D","text":"Always call the newest model alias to pick up improvements"},{"letter":"E","text":"Add retries around the parser"}],"answer":["A","B"],"explanation":"Pinning (A) keeps model behavior fixed until you choose to move, and versioned prompts (B) make every behavior change reviewable and revertible. A floating alias (D) and direct production edits (C) are how silent changes happen. Retries (E) repeat the same broken output."},{"n":9,"domain":"d1","scenario":null,"stem":"A receipt-processing app sends 4,000 x 3,000-pixel phone photos. Latency is high, and tests show accuracy holds at lower resolution. What should change?","code":null,"options":[{"letter":"A","text":"Send the receipts through the Batch API"},{"letter":"B","text":"Convert the images to base64 text and paste them into the prompt"},{"letter":"C","text":"Place the image after the question in the message"},{"letter":"D","text":"Resize the images in the app before upload; oversized images are scaled down on Anthropic's side anyway, which adds latency, and image tokens grow with pixel area up to the model's limit"}],"answer":["D"],"explanation":"Each model has a maximum native resolution, and larger images are downscaled before processing, so sending them full-size costs upload time and latency without adding detail (D). Base64 (B) is the normal transport for images and changes nothing about their size. Batch (A) trades latency for price, the wrong direction here. Placement (C) has a small effect on quality, and Anthropic recommends putting images before the text."},{"n":10,"domain":"d1","scenario":null,"stem":"Before launch, you need to know whether a 180-page contract plus your instructions fits in the model's context window, and what each request will cost. What is the best approach?","code":null,"options":[{"letter":"A","text":"Send the request and see whether it fails"},{"letter":"B","text":"Call the token counting endpoint with the exact request (system prompt, tools and messages)"},{"letter":"C","text":"Estimate four characters per token"},{"letter":"D","text":"Ask Claude how many tokens the contract contains"}],"answer":["B"],"explanation":"The token counting endpoint measures the request exactly as the model will receive it (B). A rule of thumb (C) can be far off, especially with tables, code or non-English text. Trial and error (A) costs money and tells you nothing until it fails. Claude can't reliably count its own input tokens (D)."},{"n":11,"domain":"d2","scenario":null,"stem":"A team's monthly API bill doubled, and evals show quality is fine. Which TWO levers should they try before downgrading the model tier? (Select TWO)","code":null,"options":[{"letter":"A","text":"Move all traffic to the fast tier today"},{"letter":"B","text":"Trim context: drop stale tool outputs and history the model no longer needs"},{"letter":"C","text":"Cache the stable prefix (tools and system prompt)"},{"letter":"D","text":"Send all traffic, live chat included, through the Batch API"},{"letter":"E","text":"Raise `max_tokens` so fewer responses get cut off"}],"answer":["B","C"],"explanation":"Trimming (B) and caching (C) cut cost without touching the model, so they come before a tier change, which should only happen with eval evidence (A). Batch (D) fits only work nobody is waiting for. A higher `max_tokens` (E) can raise spend."},{"n":12,"domain":"d2","scenario":null,"stem":"A coding agent on a model that supports the effort parameter works well but runs slowly and uses many tokens on routine refactors. Evals show quality holds at a lower effort level for those tasks. What should change?","code":null,"options":[{"letter":"A","text":"Switch to a smaller model without testing it"},{"letter":"B","text":"Set `max_tokens` to 512 for every request"},{"letter":"C","text":"Lower `output_config.effort` for routine refactors and keep a higher level for hard tasks"},{"letter":"D","text":"Turn on extended thinking with a large budget"}],"answer":["C"],"explanation":"Effort controls how many tokens Claude spends across the whole response, thinking and tool calls included, without changing models, and the evals already show the lower level holds (C). A skips the evidence step. A hard cap (B) truncates work midway. More thinking (D) adds tokens and latency, the opposite of the goal."},{"n":13,"domain":"d2","scenario":null,"stem":"A team enabled extended thinking on every request, including one-line greetings in their chatbot. Latency and cost rose, with no measurable quality gain on those replies. What is the best response?","code":null,"options":[{"letter":"A","text":"Raise the thinking budget further"},{"letter":"B","text":"Decide per workload: keep deeper reasoning where evals show gains on multi-step problems, and reduce it for simple turns"},{"letter":"C","text":"Turn thinking off everywhere"},{"letter":"D","text":"Move to the most capable model"}],"answer":["B"],"explanation":"Thinking buys accuracy on multi-step problems and costs output tokens and latency everywhere else, so it's a per-workload choice backed by evals (B). C gives up the gains where they exist. A and D spend more on replies that didn't need it."},{"n":14,"domain":"d2","scenario":null,"stem":"Your test suite checks that the model's summary exactly equals a stored 'golden' string, and the tests keep flaking. What is a better approach?","code":null,"options":[{"letter":"A","text":"Assert on structure and key facts (schema validity, required fields, the figures that must appear) or grade against a rubric"},{"letter":"B","text":"Retry each test until it matches"},{"letter":"C","text":"Delete the flaky tests"},{"letter":"D","text":"Set temperature to 0 and keep exact string matching, since that makes outputs fully deterministic"}],"answer":["A"],"explanation":"Sampled outputs vary between runs, so tests should check what matters about an output instead of its exact wording (A). A temperature of 0 (D) reduces variation and still doesn't guarantee identical text. Retrying until a pass (B) hides real regressions, and deleting tests (C) removes the safety net."},{"n":15,"domain":"d2","scenario":null,"stem":"An autocomplete feature must return short suggestions within a few hundred milliseconds, and the quality bar is modest. Which setup fits?","code":null,"options":[{"letter":"A","text":"A top-tier model with extended thinking"},{"letter":"B","text":"A balanced-tier model with `max_tokens` of 32,000"},{"letter":"C","text":"The Batch API"},{"letter":"D","text":"A fast-tier (Haiku-class) model with streaming and a small `max_tokens`"}],"answer":["D"],"explanation":"Latency-critical, high-volume, bounded tasks are the fast tier's case (D). A adds the most latency of all the options. Batch (C) is asynchronous. B misses the latency target, and a huge output budget is pointless for short suggestions."},{"n":16,"domain":"d3","scenario":null,"stem":"A team wants an autonomous agent to convert CSV exports into a fixed JSON layout. The column mapping never changes. What is the best approach?","code":null,"options":[{"letter":"A","text":"An Agent SDK agent with file tools"},{"letter":"B","text":"A manager agent with three subagents"},{"letter":"C","text":"A deterministic script, or a single model call with a schema if some fields need interpretation, with no agent loop"},{"letter":"D","text":"An orchestration framework with a state graph"}],"answer":["C"],"explanation":"Apply the four-question test: the task isn't complex, its path is fully known, and code can avoid errors cheaply, so autonomy only adds cost and unpredictability (C). A, B and D each add machinery the problem doesn't need."},{"n":17,"domain":"d3","scenario":null,"stem":"Which TWO things does the Claude Agent SDK give you that you would otherwise build yourself in a custom loop? (Select TWO)","code":null,"options":[{"letter":"A","text":"A visual drag-and-drop workflow designer"},{"letter":"B","text":"Automatic fine-tuning on your traces"},{"letter":"C","text":"Context management, plus hooks and permissions for deterministic control"},{"letter":"D","text":"The agent loop with built-in tools for files, shell commands and search"},{"letter":"E","text":"A hosted vector database for retrieval"}],"answer":["C","D"],"explanation":"The Agent SDK packages the same harness Claude Code runs on: the loop and built-in tools (D), plus context management, hooks, permissions and subagents (C). It doesn't host a vector database (E), fine-tune models (B) or provide a visual designer (A)."},{"n":18,"domain":"d3","scenario":null,"stem":"A bank's agent must keep all code execution and data inside its own network for data-residency rules. A startup wants the fastest path to production. Which deployment fits each?","code":null,"options":[{"letter":"A","text":"Managed for the bank, self-hosted for the startup"},{"letter":"B","text":"Self-hosted for the bank, managed for the startup"},{"letter":"C","text":"Self-hosted for both"},{"letter":"D","text":"Managed for both"}],"answer":["B"],"explanation":"Residency and custom-runtime requirements point to self-hosted execution, and speed to production points to a managed deployment where the provider runs the loop and the sandbox (B). D puts the bank's data outside its network. C slows the startup down for a requirement it doesn't have. A reverses both."},{"n":19,"domain":"d3","scenario":null,"stem":"An agent must summarize 12 long PDFs independently, then write a comparison across them. The single-agent version runs out of context. What is the best design?","code":null,"options":[{"letter":"A","text":"One agent reads all 12 PDFs in sequence in a single context"},{"letter":"B","text":"Twelve agents that send their findings to each other directly"},{"letter":"C","text":"Raise `max_tokens` on the single agent"},{"letter":"D","text":"An orchestrator gives each PDF to a subagent with its own context, runs them in parallel, and writes the comparison from their summaries"}],"answer":["D"],"explanation":"The summaries are independent subtasks, so isolated subagent contexts fit, and only compact reports return to the orchestrator (D). A is the design that already failed. `max_tokens` (C) limits output, and the problem is input. Agents talking to each other directly (B) remove the coordinator that merges results and isolates failures."},{"n":20,"domain":"d4","scenario":null,"stem":"You pass a 50-page contract and ask detailed questions about it. Answers sometimes miss relevant clauses. Which prompt structure follows Anthropic's long-context guidance?","code":null,"options":[{"letter":"A","text":"The contract first, wrapped in tags such as `<contract>`, then the instructions and question at the end, optionally asking Claude to quote the relevant clauses before answering"},{"letter":"B","text":"The question first, then the contract"},{"letter":"C","text":"The contract twice, once before and once after the question"},{"letter":"D","text":"The question in the middle of the contract"}],"answer":["A"],"explanation":"Anthropic recommends putting long documents at the top and the query at the end, and reports up to 30% better responses in tests with complex inputs; asking for supporting quotes first also helps Claude focus (A). B and D go against that guidance. C doubles the cost and the noise."},{"n":21,"domain":"d4","scenario":null,"stem":"Your code forced JSON output by prefilling the assistant turn with an opening brace. After moving to a newer model, requests with the prefilled last assistant turn return a 400 error. What is the recommended replacement?","code":{"lang":"python","text":"messages = [\n    {\"role\": \"user\", \"content\": f\"Extract the fields from: {doc}\"},\n    {\"role\": \"assistant\", \"content\": \"{\"},   # prefill\n]"},"options":[{"letter":"A","text":"Stay on the older model permanently"},{"letter":"B","text":"Prefill with an opening square bracket instead"},{"letter":"C","text":"Add 'respond only in JSON' and extract the first {...} block with a regex"},{"letter":"D","text":"Structured outputs: send the JSON schema in `output_config.format` and remove the prefill"}],"answer":["D"],"explanation":"Starting with the Claude 4.6 models, a prefilled last assistant turn is rejected, and Anthropic's migration guidance for format control points to structured outputs (D). B is still a prefill. C goes back to probabilistic formatting with fragile parsing. A blocks every future upgrade."},{"n":22,"domain":"d4","scenario":null,"stem":"Which TWO practices make a few-shot prompt for a tricky classification more reliable? (Select TWO)","code":null,"options":[{"letter":"A","text":"Examples that all share the same label"},{"letter":"B","text":"Examples wrapped in tags such as `<example>`, clearly separated from the input to classify"},{"letter":"C","text":"Examples that contradict the instructions, to test robustness"},{"letter":"D","text":"Fifty near-identical examples"},{"letter":"E","text":"Two to four varied examples, including one the model should correctly reject"}],"answer":["B","E"],"explanation":"A small, varied set with a negative case teaches the boundary (E), and clear separation keeps the model from mixing examples with the real input (B). Near-identical examples (D) and single-label sets (A) teach a narrow pattern. Contradictory examples (C) teach the model to ignore your instructions."},{"n":23,"domain":"d5","scenario":null,"stem":"Which statement about server-side tools such as web search is correct?","code":null,"options":[{"letter":"A","text":"They're available only through MCP"},{"letter":"B","text":"They run on Anthropic's infrastructure, so your code doesn't execute them or send `tool_result` blocks for them"},{"letter":"C","text":"Your application must implement and execute them"},{"letter":"D","text":"They work only in the Batch API"}],"answer":["B"],"explanation":"Server tools execute on Anthropic's side, and their results come back inside the response (B). Client tools are the ones your code runs (C). Server tools are declared in the tools parameter like any other tool (A), and they work in regular requests (D)."},{"n":24,"domain":"d5","scenario":null,"stem":"Your company's quarterly-report procedure is 12 steps with templates and formatting rules. Teams want Claude to follow it in claude.ai, Claude Code and the API. No new external system is involved. Which mechanism fits?","code":null,"options":[{"letter":"A","text":"An MCP server"},{"letter":"B","text":"A fine-tuned model"},{"letter":"C","text":"A Skill: packaged instructions and templates that load when the task matches"},{"letter":"D","text":"A custom tool"}],"answer":["C"],"explanation":"The need is know-how and workflow steps, which is what Skills package (C). Tools (D) and MCP servers (A) add actions or data access, and nothing here needs a new action or data source. Fine-tuning (B) is heavy machinery for a procedure that fits in a document."},{"n":25,"domain":"d5","scenario":null,"stem":"An agent calls `create_shipment` with inputs that sometimes have the wrong type (weight as a string) or miss required fields, which breaks your handler. Which API feature addresses this at the source?","code":null,"options":[{"letter":"A","text":"`strict: true` on the tool definition, so tool inputs follow the `input_schema`"},{"letter":"B","text":"A lower temperature"},{"letter":"C","text":"A longer tool description"},{"letter":"D","text":"`tool_choice` set to `auto`"}],"answer":["A"],"explanation":"Strict tool use applies schema validation to the tool's inputs (A). A better description (C) helps the model pick and fill the tool and still guarantees nothing. `auto` (D) is the default and changes nothing. Temperature (B) affects variation and can't guarantee types."},{"n":26,"domain":"d6","scenario":null,"stem":"A research agent reads web pages. One page hides text telling the agent to email the user's files to an outside address, and the agent has a `send_email` tool. Which TWO controls most directly reduce this risk? (Select TWO)","code":null,"options":[{"letter":"A","text":"A system-prompt line telling the agent to ignore malicious instructions, as the only defense"},{"letter":"B","text":"A deterministic gate in code that blocks or holds any action sending data to an external address"},{"letter":"C","text":"A larger model"},{"letter":"D","text":"A higher temperature"},{"letter":"E","text":"Scope tools by least privilege: the research agent gets no `send_email` tool, or outbound email requires human approval"}],"answer":["B","E"],"explanation":"Content the agent reads is an untrusted channel, so the strongest controls limit what an injected instruction can do: no dangerous capability (E) and a programmatic check on risky actions (B). A prompt instruction on its own (A) is probabilistic. Model size (C) and temperature (D) aren't security controls."},{"n":27,"domain":"d6","scenario":null,"stem":"A developer put the production API key into a system-prompt template in the repository 'so the agent can call internal APIs.' Which TWO steps fix this? (Select TWO)","code":null,"options":[{"letter":"A","text":"Rotate the key, and store secrets in environment variables or a secret manager"},{"letter":"B","text":"Tell the model never to reveal the key"},{"letter":"C","text":"Base64-encode the key in the template"},{"letter":"D","text":"Have your tool code authenticate to the internal APIs, so the model never sees the credential"},{"letter":"E","text":"Move the key to the end of the prompt"}],"answer":["A","D"],"explanation":"A key in a repository and a prompt is already exposed, so it gets rotated and stored properly (A), and credentials belong in the code that executes tools, outside the model's context (D). Encoding (C) is trivially reversed, an instruction (B) is probabilistic, and moving the key (E) keeps it in the prompt."},{"n":28,"domain":"d6","scenario":null,"stem":"An internal HR assistant answers every employee's questions using one service account that can read all employee records. A junior employee asked about a colleague's salary and got an answer. What is the root fix?","code":null,"options":[{"letter":"A","text":"Remove salary data from the HR system"},{"letter":"B","text":"Add a system-prompt rule: 'Never reveal salaries'"},{"letter":"C","text":"Filter out responses that contain the word 'salary'"},{"letter":"D","text":"Run lookups with the calling user's identity and permissions, and log each tool call against that user"}],"answer":["D"],"explanation":"The shared over-privileged account erased per-user authorization and the audit trail, and acting as the caller restores both (D). B is a probabilistic patch. A breaks legitimate HR work. A keyword filter (C) is easy to get around and blocks legitimate answers."},{"n":29,"domain":"d7","scenario":null,"stem":"Which files should hold a team's shared Claude Code permission rules (for example, allowing `Bash(npm run test *)`) and one developer's personal overrides for the same project?","code":null,"options":[{"letter":"A","text":"`~/.claude/settings.json` for the team; `.claude/settings.json` for the developer"},{"letter":"B","text":"`CLAUDE.md` for both"},{"letter":"C","text":"`.claude/settings.json`, committed, for the team; `.claude/settings.local.json`, gitignored, for the developer"},{"letter":"D","text":"`.mcp.json` for the team; `CLAUDE.local.md` for the developer"}],"answer":["C"],"explanation":"The project settings file is shared through version control, and the local settings file holds personal overrides for that project without being committed (C). User-level settings (A) apply to one person across all projects. `CLAUDE.md` files (B, D) hold instructions, while permissions are enforced from settings files, and `.mcp.json` configures MCP servers."},{"n":30,"domain":"d8","scenario":null,"stem":"After you add a new tool named `get order status`, every request returns 400 `invalid_request_error`. What is the first move?","code":null,"options":[{"letter":"A","text":"Fix the request: tool names may contain only letters, digits, underscores and hyphens, so rename it (for example, `get_order_status`)"},{"letter":"B","text":"Switch to a different model"},{"letter":"C","text":"Retry with exponential backoff"},{"letter":"D","text":"Rewrite the system prompt"}],"answer":["A"],"explanation":"A 400 is a client error caused by the request itself, and the tool name breaks the documented pattern `^[a-zA-Z0-9_-]{1,128}$` (A). Retries (C) repeat the same invalid request. The model (B) and the prompt (D) play no part in request validation."}]},{"id":"cca-f","code":"CCA-F","name":"Claude Certified Architect - Foundations","certPage":"https://preporato.com/certificates/claude-certified-architect","guide":"https://github.com/preporato/claude-certification-guide/blob/main/cca-f/guide.md","exam":{"questions":60,"minutes":120},"minutes":60,"domains":[{"id":"d1","name":"Agentic Architecture & Orchestration","weight":27,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/cca-f/guide.md#domain-1-agentic-architecture--orchestration-27"},{"id":"d2","name":"Tool Design & MCP Integration","weight":18,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/cca-f/guide.md#domain-2-tool-design--mcp-integration-18"},{"id":"d3","name":"Claude Code Configuration & Workflows","weight":20,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/cca-f/guide.md#domain-3-claude-code-configuration--workflows-20"},{"id":"d4","name":"Prompt Engineering & Structured Output","weight":20,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/cca-f/guide.md#domain-4-prompt-engineering--structured-output-20"},{"id":"d5","name":"Context Management & Reliability","weight":15,"guide":"https://github.com/preporato/claude-certification-guide/blob/main/cca-f/guide.md#domain-5-context-management--reliability-15"}],"scenarios":[{"id":"support","title":"Customer Support Escalation System","text":"A retailer's support system uses a coordinator agent that receives each customer conversation and delegates to three subagents: an order-lookup agent with read-only order tools, a refund agent that can issue refunds, and a policy agent that searches the returns-policy knowledge base. Company policy: refunds above $250 need a human's approval, and customers can come back to an open conversation within 7 days."},{"id":"audit","title":"Multi-Repository Security Audit","text":"A security team runs a nightly audit across 40 repositories. A coordinator spawns one scanner subagent per repository. Each scanner has `Read`, `Grep` and `Glob` plus a dependency-check tool. The coordinator merges the findings into one report for the morning stand-up and opens tickets for new critical issues."}],"questions":[{"n":1,"domain":"d1","scenario":"support","stem":"The refund agent needs the order total, the purchase date and the customer's stated reason to decide eligibility. What should the coordinator include when it delegates the task?","code":null,"options":[{"letter":"A","text":"An instruction for the refund agent to ask the customer to repeat the details"},{"letter":"B","text":"The full raw transcript plus every prior tool output, so the refund agent misses nothing"},{"letter":"C","text":"The specific facts the refund agent needs, written into the delegation prompt: order id, total, purchase date and the customer's stated reason"},{"letter":"D","text":"Nothing extra, because subagents can read the coordinator's conversation history"}],"answer":["C"],"explanation":"Subagents in a hub-and-spoke design start with their own context window and see only what the coordinator passes to them, so C is the working design: the minimum necessary context, stated explicitly. D assumes an inheritance that doesn't exist. B spends tokens and attention on material the decision doesn't need, which is where lost-in-the-middle errors start. A makes the customer pay for a gap the coordinator could close with facts it already has."},{"n":2,"domain":"d5","scenario":"support","stem":"Which TWO events should trigger a handoff to a human agent? (Select TWO)","code":null,"options":[{"letter":"A","text":"Answering the customer's question takes three tool calls"},{"letter":"B","text":"The customer asks to speak to a person"},{"letter":"C","text":"The model reports a confidence score of 0.62 on its eligibility decision"},{"letter":"D","text":"The customer writes in capital letters and says they are furious about a covered $90 refund"},{"letter":"E","text":"The customer requests a $400 refund for an order the policy covers"}],"answer":["B","E"],"explanation":"An explicit request for a human (B) is a standing escalation trigger, and the $400 refund (E) crosses the $250 approval threshold, which makes the handoff mandatory under policy. Sentiment alone (D) is no trigger when the request sits inside clear policy; the agent can resolve it while acknowledging the frustration. Self-reported confidence (C) is poorly calibrated and makes an unreliable trigger. Task complexity (A) is the agent's job."},{"n":3,"domain":"d2","scenario":"support","stem":"The policy agent's knowledge-base search sometimes fails because the search service times out, and sometimes finds nothing because no policy covers the case. Both situations currently return an empty list. How should the tool respond instead?","code":null,"options":[{"letter":"A","text":"Keep returning an empty list in both cases and let the agent retry"},{"letter":"B","text":"Return a structured error for the timeout (error type, retryable: true, what was attempted) and a successful empty result for the no-match case"},{"letter":"C","text":"Return the closest-matching policy in both cases so the agent always has something to cite"},{"letter":"D","text":"Raise an exception in both cases so the coordinator ends the conversation"}],"answer":["B"],"explanation":"B separates a transient failure from a valid empty result, and the two need different recovery: retry the search, or tell the customer no policy applies. With A, the agent can't tell an outage from a real answer and may report that no policy covers the case during an outage. D ends conversations over a recoverable timeout. C invents relevance, which leads the agent to cite a policy that doesn't apply."},{"n":4,"domain":"d1","scenario":"support","stem":"A customer returns four days later to continue a conversation about a pending refund. Separately, a supervisor wants to test a different resolution on a copy of that conversation without changing what the customer sees. Which pairing fits?","code":null,"options":[{"letter":"A","text":"Start fresh sessions for both and paste the last assistant message into each system prompt"},{"letter":"B","text":"Fork the session for the customer and resume it for the supervisor"},{"letter":"C","text":"Resume the same session for both"},{"letter":"D","text":"Resume the customer's session so the full history is restored, and fork a separate copy for the supervisor"}],"answer":["D"],"explanation":"Resuming continues a session with its history intact, which is what the returning customer needs. Forking creates an independent branch from the same history, and changes in the fork never flow back, which is what the supervisor needs. D matches both. B swaps the two. C lets the supervisor's experiment change the customer's conversation. A throws away most of the context and relies on one message to carry it."},{"n":5,"domain":"d1","scenario":"audit","stem":"Which execution pattern fits the scanning stage and the report stage?","code":null,"options":[{"letter":"A","text":"Fan out the 40 scans in parallel, because they are independent, then run one merge step that builds the report from normalized results"},{"letter":"B","text":"Run several report writers in parallel and concatenate their outputs"},{"letter":"C","text":"Use one agent that scans all 40 repositories in a single context so it can spot cross-repository patterns"},{"letter":"D","text":"Scan sequentially so each scanner can learn from the previous one's findings, then write the report in parallel sections"}],"answer":["A"],"explanation":"Independent work runs in parallel and dependent work runs in sequence, so the hybrid in A matches the data dependencies: the scans don't need each other, and the report needs all of them. D serializes independent work and slows the audit for no gain. C pushes 40 repositories into one context, which degrades attention and turns one failure into a total failure. B produces a report with no single view of the findings, which is what the merge step exists for."},{"n":6,"domain":"d5","scenario":"audit","stem":"Last night the audit crashed at repository 27. The rerun started again from repository 1 and opened duplicate tickets for findings already reported. Which TWO changes fix this? (Select TWO)","code":null,"options":[{"letter":"A","text":"Checkpoint progress to a manifest file (completed repositories, pending repositories, results so far) and resume from it after a crash"},{"letter":"B","text":"Give the scanners larger context windows so they remember the previous run"},{"letter":"C","text":"Run the audit weekly instead of nightly"},{"letter":"D","text":"Make ticket creation idempotent, for example keyed by repository and finding id, so a replay can't create duplicates"},{"letter":"E","text":"Ask the coordinator at startup which repositories it already finished"}],"answer":["A","D"],"explanation":"A manifest (A) lets the restarted coordinator continue from repository 27, and idempotent side effects (D) make any replayed step harmless; together they turn a crash into a delay. Context windows (B) don't survive a process crash, and the coordinator has no memory of the previous run to ask about (E), because the API is stateless. Running less often (C) leaves the failure in place."},{"n":7,"domain":"d2","scenario":"audit","stem":"An engineer proposes giving every scanner the full tool set, including `Write`, `Bash` and the ticketing tool, 'in case they need it.' What is the best response?","code":null,"options":[{"letter":"A","text":"Replace the scanner tools with Bash alone, since Bash can do everything the other tools do"},{"letter":"B","text":"Give the scanners every tool and add a system-prompt rule forbidding writes"},{"letter":"C","text":"Keep each scanner on the read-only tools its job needs, and let only the coordinator open tickets from the merged findings"},{"letter":"D","text":"Accept the proposal, because more tools make the scanners more capable"}],"answer":["C"],"explanation":"Least privilege scopes each agent to what its responsibility requires. C also keeps tool selection accurate and stops a misbehaving scanner from changing code or opening tickets. D widens the blast radius and adds selection noise for capabilities nobody uses. B relies on a probabilistic instruction to restrain a capability that should never be there. A hands the scanners the broadest tool of all."},{"n":8,"domain":"d5","scenario":"audit","stem":"The morning report said 'No critical issues found across all repositories.' The team later learns that six scanners hit their token budgets and skipped their largest files. What should the report format have required?","code":null,"options":[{"letter":"A","text":"Nothing; the scanners needed a more capable model"},{"letter":"B","text":"A longer narrative summary from each scanner"},{"letter":"C","text":"A confidence score from each scanner"},{"letter":"D","text":"A coverage annotation from every scanner (files reviewed, files skipped with reasons, coverage counts) carried into the merged report"}],"answer":["D"],"explanation":"Without explicit coverage, 'no issues found' can't be told apart from 'no issues found in the part that ran.' D makes the gap visibl
